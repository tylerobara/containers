# Melange build for Apache guacamole-server (github.com/apache/guacamole-server)
# — the guacd proxy daemon, libguac and the protocol plugins, built from the
# official Apache dist source tarball (dist.apache.org, sha256 published
# alongside), which ships the release manager's generated configure. The
# GitHub tag archive + autoreconf route is DELIBERATELY not used: modern
# autoconf (Wolfi ships 2.72) rejects this old configure.ac outright —
# "configure.ac:338: error: undefined or overquoted macro: AC_MSG_WARN" —
# so autoreconf from the archive cannot build it (PR #99 CI proved this).
# The autotools build deps stay in the environment anyway as maintainer-mode
# regeneration insurance. Packaged as plain `guacamole-server` so
# grype/secdb name-match. Wolfi DOES ship guacamole-server (currently
# 1.6.0-rN, split into libguac + libguac-client-* subpackages), so epoch 100 +
# provider-priority 100 are what keep OUR package winning resolution — and our
# version must stay AT OR ABOVE the live Wolfi version (the workflow's lock
# guard fails loudly if apko ever resolves Wolfi's build instead of ours).
#
# Build set = the proven flags from upstream's own guacd Dockerfile
# (--disable-guaclog + CPPFLAGS=-Wno-error=deprecated-declarations), but the
# protocol plugins link Wolfi system libraries instead of upstream's
# from-source /opt/guacamole stack (FreeRDP 3, libvncclient, libtelnet,
# libwebsockets) — the same approach Wolfi's own build takes. Protocols are
# auto-detected by configure; the assert step below fails loudly if any of the
# five (rdp, ssh, telnet, vnc, kubernetes) goes missing, so a Wolfi
# -dev-package rename can never silently drop RDP/VNC/... support.
#
# Bump `version` + `vars.sha256` on each release (upstream publishes NO GitHub
# releases — tags only; the update-versions bot row filters the tag list for
# the strict X.Y.Z shape, which drops the 1.6.0-RC* candidates).

package:
  name: guacamole-server
  version: 1.6.0
  epoch: 100
  description: "Clientless remote desktop gateway (guacd) built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the Apache dist source tarball (matches the .sha256 Apache
  # publishes next to it, verified at release time)
  sha256: 8bc45675da96d7b6f39728160181e3d4ff3c08f460f6d26de5805b642bf13f2b

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      # Autotools toolchain kept as maintainer-mode insurance (the tarball's
      # timestamps could make a Makefile rule re-invoke aclocal/automake);
      # configure itself ships pre-generated, so nothing here autoreconf's.
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - libtool
      - m4
      - pkgconf
      # libguac core: the system-library set Wolfi's own build links against.
      - cairo-dev
      - ffmpeg-8.1-dev
      - libjpeg-turbo-dev
      - libogg-dev
      - libpng-dev
      - libvorbis-dev
      - libwebp-dev
      - openssl-dev
      - pango-dev
      - pulseaudio-dev
      - util-linux-dev # uuid/uuid.h (configure AC_CHECK_LIB uuid)
      - zlib-dev
      # Protocol support (configure auto-detects each): RDP via FreeRDP 3
      # (freerdp3 .pc; the freerdp2 check comes first but only 3 ships here),
      # VNC via libvncclient, SSH via libssh2, telnet via libtelnet (which
      # ships its header + .pc in the main package), Kubernetes via
      # libwebsockets.
      - freerdp-3-dev
      - libssh2-dev
      - libtelnet
      - libvncserver-dev
      - libwebsockets-dev

pipeline:
  - runs: |
      mkdir -p /home/build
      # Official Apache dist tarball (ships the generated configure; see the
      # header for why the GitHub tag archive can't be autoreconf'd here).
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://dist.apache.org/repos/dist/release/guacamole/${{package.version}}/source/guacamole-server-${{package.version}}.tar.gz" \
        -o /home/build/guacamole-server.tar.gz
      echo "${{vars.sha256}}  /home/build/guacamole-server.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf guacamole-server.tar.gz && rm guacamole-server.tar.gz

  - working-directory: /home/build/guacamole-server-${{package.version}}
    runs: |
      # Backport of upstream master's src/libguac/wol.c. The 1.6.0 file runs
      # inet_pton(AF_INET6, ..., &sockaddr_in.sin_addr): a 16-byte IPv6 write
      # into the 4-byte struct in_addr inside a struct sockaddr_in — a real
      # stack overflow past the end of sockaddr_in that glibc fortify reports
      # as "call to '__inet_pton_chk_warn' ... destination buffer size too
      # small", fatal under upstream's -Werror (older compilers never
      # diagnosed it). Upstream master rewrote the conversion onto
      # sockaddr_storage with per-family helpers; that file is dropped in
      # verbatim except sendto(), unwrapped from GUAC_RETRY_EINTR (a macro
      # that does not exist in 1.6.0) to keep the plain-sendto behavior 1.6.0
      # shipped. Verbatim otherwise, ASF header included.
      cat > src/libguac/wol.c <<'WOL_EOF'
      /*
       * Licensed to the Apache Software Foundation (ASF) under one
       * or more contributor license agreements.  See the NOTICE file
       * distributed with this work for additional information
       * regarding copyright ownership.  The ASF licenses this file
       * to you under the Apache License, Version 2.0 (the
       * "License"); you may not use this file except in compliance
       * with the License.  You may obtain a copy of the License at
       *
       *   http://www.apache.org/licenses/LICENSE-2.0
       *
       * Unless required by applicable law or agreed to in writing,
       * software distributed under the License is distributed on an
       * "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF ANY
       * KIND, either express or implied.  See the License for the
       * specific language governing permissions and limitations
       * under the License.
       */

      #include "guacamole/error.h"
      #include "guacamole/tcp.h"
      #include "guacamole/timestamp.h"
      #include "guacamole/wol.h"

      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>
      #include <unistd.h>
      #include <arpa/inet.h>
      #include <netinet/in.h>
      #include <sys/socket.h>

      /**
       * Generate the magic Wake-on-LAN (WoL) packet for the specified MAC address
       * and place it in the character array.
       * 
       * @param packet
       *     The character array that will contain the generated packet.
       * 
       * @param mac_address
       *     The unsigned int representation of the MAC address to place in the packet.
       */
      static void __guac_wol_create_magic_packet(unsigned char packet[],
              unsigned int mac_address[]) {
          
          int i;
          unsigned char mac[6];
          
          /* Concurrently fill the first part of the packet with 0xFF, and copy the
           MAC address from the int array to the char array. */
          for (i = 0; i < 6; i++) {
              packet[i] = 0xFF;
              mac[i] = mac_address[i];
          }
          
          /* Copy the MAC address contents into the char array that is storing
           the rest of the packet. */
          for (i = 1; i <= 16; i++) {
              memcpy(&packet[i * 6], &mac, 6 * sizeof(unsigned char));
          }
          
      }

      /**
       * Converts the given IPv4 address and UDP port number into its binary
       * representation (struct sockaddr_in). The size of the structure used will be
       * stored in wol_dest_size.
       *
       * @param addr
       *     The IPv4 address to convert.
       *
       * @param udp_port
       *     The UDP port number to convert and include in the resulting sockaddr_in
       *     structure.
       *
       * @param wol_dest
       *     Storage that is sufficiently large and correctly aligned such that it
       *     may be typecast as a sockaddr_in without issue (this is guaranteed by
       *     the definition of the sockaddr_storage structure).
       *
       * @param wol_dest_size
       *     Pointer to a socklen_t that should receive the size of the sockaddr_in
       *     structure. This value is assigned only if this call succeeds.
       *
       * @return
       *     A positive value if conversion succeeded, zero if conversion failed, and
       *     a negative value if IPv4 is unsupported by this system.
       */
      static int __guac_wol_convert_addr_ipv4(const char* addr, const unsigned short udp_port,
              struct sockaddr_storage* wol_dest, socklen_t* wol_dest_size) {

          struct sockaddr_in* wol_dest_ipv4 = (struct sockaddr_in*) wol_dest;
          *wol_dest_size = sizeof(struct sockaddr_in);

          /* Init address structure for IPv4 details */
          memset(wol_dest, 0, *wol_dest_size);
          wol_dest_ipv4->sin_port = htons(udp_port);
          wol_dest_ipv4->sin_family = AF_INET;

          return inet_pton(wol_dest_ipv4->sin_family, addr, &(wol_dest_ipv4->sin_addr));

      }

      /**
       * Converts the given IPv6 address and UDP port number into its binary
       * representation (struct sockaddr_in6). The size of the structure used will be
       * stored in wol_dest_size.
       *
       * @param addr
       *     The IPv6 address to convert.
       *
       * @param udp_port
       *     The UDP port number to convert and include in the resulting sockaddr_in6
       *     structure.
       *
       * @param wol_dest
       *     Storage that is sufficiently large and correctly aligned such that it
       *     may be typecast as a sockaddr_in6 without issue (this is guaranteed by
       *     the definition of the sockaddr_storage structure).
       *
       * @param wol_dest_size
       *     Pointer to a socklen_t that should receive the size of the sockaddr_in6
       *     structure. This value is assigned only if this call succeeds.
       *
       * @return
       *     A positive value if conversion succeeded, zero if conversion failed, and
       *     a negative value if IPv6 is unsupported by this system.
       */
      static int __guac_wol_convert_addr_ipv6(const char* addr, const unsigned short udp_port,
               struct sockaddr_storage* wol_dest, socklen_t* wol_dest_size) {

          struct sockaddr_in6* wol_dest_ipv6 = (struct sockaddr_in6*) wol_dest;
          *wol_dest_size = sizeof(struct sockaddr_in6);

          /* Init address structure for IPv6 details */
          memset(wol_dest, 0, *wol_dest_size);
          wol_dest_ipv6->sin6_family = AF_INET6;
          wol_dest_ipv6->sin6_port = htons(udp_port);

          return inet_pton(wol_dest_ipv6->sin6_family, addr, &(wol_dest_ipv6->sin6_addr));

      }

      /**
       * Converts the given IPv4 or IPv6 address and UDP port number into its binary
       * representation (either a struct sockaddr_in or struct sockaddr_in6). The
       * size of the structure used will be stored in wol_dest_size. If conversion
       * fails, guac_error and guac_error_message are set appropriately.
       *
       * @param addr
       *     The address to convert.
       *
       * @param udp_port
       *     The UDP port number to convert and include in the resulting structure.
       *
       * @param wol_dest
       *     Storage that is sufficiently large and correctly aligned such that it
       *     may be typecast as a sockaddr_in OR sockaddr_in6 without issue (this is
       *     guaranteed by the definition of the sockaddr_storage structure).
       *
       * @param wol_dest_size
       *     Pointer to a socklen_t that should receive the size of the structure
       *     ultimately used. This value is assigned only if this call succeeds.
       *
       * @return
       *     Non-zero if conversion succeeded, zero otherwise.
       */
      static int __guac_wol_convert_addr(const char* addr, const unsigned short udp_port,
                struct sockaddr_storage* wol_dest, socklen_t* wol_dest_size) {

          /* Attempt to resolve as an IPv4 address first */
          int ipv4_retval = __guac_wol_convert_addr_ipv4(addr, udp_port, wol_dest, wol_dest_size);
          if (ipv4_retval > 0)
              return 1;

          /* Failing that, reattempt as IPv6 */
          int ipv6_retval = __guac_wol_convert_addr_ipv6(addr, udp_port, wol_dest, wol_dest_size);
          if (ipv6_retval > 0)
              return 1;

          /*
           * Translate all possible IPv4 / IPv6 failure combinations into a single,
           * human-readable message.
           */

          /* The provided address is not valid IPv4 ... */
          if (ipv4_retval == 0) {

              /* ... and also not valid IPv6. */
              if (ipv6_retval == 0) {
                  guac_error = GUAC_STATUS_INVALID_ARGUMENT;
                  guac_error_message = "The broadcast or multicast address "
                      "specified for Wake-on-LAN is not a valid IPv4 or IPv6 "
                      "address";
              }

              /* ... but we can't try IPv6 because this system doesn't support it. */
              else {
                  guac_error = GUAC_STATUS_INVALID_ARGUMENT;
                  guac_error_message = "IPv6 is not supported by this system and "
                      "the broadcast/multicast address specified for Wake-on-LAN is "
                      "not a valid IPv4 address";
              }

          }

          /* This system bizarrely doesn't support IPv4 ... */
          else {

              /* ... and the provided address is not valid IPv6. */
              if (ipv6_retval == 0) {
                  guac_error = GUAC_STATUS_INVALID_ARGUMENT;
                  guac_error_message = "IPv4 is not supported by this system and "
                      "the broadcast/multicast address specified for Wake-on-LAN is "
                      "not a valid IPv6 address";
              }

              /* ... nor IPv6 (should be impossible). */
              else {
                  guac_error = GUAC_STATUS_NOT_SUPPORTED;
                  guac_error_message = "Neither IPv4 nor IPv6 is supported by this "
                      "system (this should not be possible)";
              }

          }

          return 0;

      }

      /**
       * Send the magic Wake-on-LAN (WoL) packet to the specified broadcast address,
       * returning the number of bytes sent, or zero if any error occurred and nothing
       * was sent.
       * 
       * @param broadcast_addr
       *     The broadcast address to which to send the magic WoL packet.
       * 
       * @param udp_port
       *     The UDP port to use when sending the WoL packet.
       * 
       * @param packet
       *     The magic WoL packet to send.
       * 
       * @return 
       *     The number of bytes sent, or zero if nothing could be sent.
       */
      static ssize_t __guac_wol_send_packet(const char* broadcast_addr,
              const unsigned short udp_port, unsigned char packet[]) {

          struct sockaddr_storage wol_dest;
          socklen_t wol_dest_size;

          /* Resolve broadcast address */
          if (!__guac_wol_convert_addr(broadcast_addr, udp_port, &wol_dest, &wol_dest_size))
              return 0;

          /* Set up the socket */
          int wol_socket = socket(wol_dest.ss_family, SOCK_DGRAM, 0);
          
          /* If socket open fails, bail out. */
          if (wol_socket < 0) {
              guac_error = GUAC_STATUS_SEE_ERRNO;
              guac_error_message = "Failed to open socket to send Wake-on-LAN packet";
              return 0;
          }

          /* Set up socket for IPv4 broadcast. */
          if (wol_dest.ss_family == AF_INET) {

              /* For configuring socket broadcast */
              int wol_bcast = 1;

              /* Attempt to set IPv4 broadcast; exit with error if this fails. */
              if (setsockopt(wol_socket, SOL_SOCKET, SO_BROADCAST, &wol_bcast,
                      sizeof(wol_bcast)) < 0) {
                  close(wol_socket);
                  guac_error = GUAC_STATUS_SEE_ERRNO;
                  guac_error_message = "Failed to set IPv4 broadcast for Wake-on-LAN socket";
                  return 0;
              }
          }
          
          /* Set up socket for IPv6 multicast. */
          else {
              
              /* Stick to a single hop for now. */
              int hops = 1;
              
              /* Attempt to set IPv6 multicast; exit with error if this fails. */
              if (setsockopt(wol_socket, IPPROTO_IPV6, IPV6_MULTICAST_HOPS, &hops,
                      sizeof(hops)) < 0) {
                  close(wol_socket);
                  guac_error = GUAC_STATUS_SEE_ERRNO;
                  guac_error_message = "Failed to set IPv6 multicast for Wake-on-LAN socket";
                  return 0;
              }
          }

          /* Send the packet and return number of bytes sent. */
          /* 1.6.0 ships a plain sendto() here; upstream master wraps this in
           * GUAC_RETRY_EINTR, a macro that does not exist in 1.6.0, so the call is
           * kept plain to preserve the released behavior exactly. */
          ssize_t bytes = sendto(wol_socket, packet, GUAC_WOL_PACKET_SIZE, 0,
                  (struct sockaddr*) &wol_dest, wol_dest_size);
          close(wol_socket);
          return bytes;
       
      }

      int guac_wol_wake(const char* mac_addr, const char* broadcast_addr,
              const unsigned short udp_port) {
          
          unsigned char wol_packet[GUAC_WOL_PACKET_SIZE];
          unsigned int dest_mac[6];
          
          /* Parse mac address and return with error if parsing fails. */
          if (sscanf(mac_addr, "%x:%x:%x:%x:%x:%x",
                  &(dest_mac[0]), &(dest_mac[1]), &(dest_mac[2]),
                  &(dest_mac[3]), &(dest_mac[4]), &(dest_mac[5])) != 6) {
              guac_error = GUAC_STATUS_INVALID_ARGUMENT;
              guac_error_message = "Invalid argument for Wake-on-LAN MAC address";
              return -1;
          }
          
          /* Generate the magic packet. */
          __guac_wol_create_magic_packet(wol_packet, dest_mac);
          
          /* Send the packet and record bytes sent. */
          int bytes_sent = __guac_wol_send_packet(broadcast_addr, udp_port, 
                  wol_packet);
          
          /* Return 0 if bytes were sent, otherwise return an error. */
          if (bytes_sent)
              return 0;
          
          return -1;
      }

      int guac_wol_wake_and_wait(const char* mac_addr, const char* broadcast_addr,
              const unsigned short udp_port, int wait_time, int retries,
              const char* hostname, const char* port, const int timeout) {

          /* Attempt to connect, first. */
          int sockfd = guac_tcp_connect(hostname, port, timeout);

          /* If connection succeeds, no need to wake the system. */
          if (sockfd > 0) {
              close(sockfd);
              return 0;
          }

          /* Close the fd to avoid resource leak. */
          close(sockfd);

          /* Send the magic WOL packet and store return value. */
          int retval = guac_wol_wake(mac_addr, broadcast_addr, udp_port);

          /* If sending WOL packet fails, just return the received return value. */
          if (retval)
              return retval;

          /* Try to connect on the specified TCP port and hostname or IP. */
          for (int i = 0; i < retries; i++) {

              sockfd = guac_tcp_connect(hostname, port, timeout);

              /* Connection succeeded - close socket and exit. */
              if (sockfd > 0) {
                  close(sockfd);
                  return 0;
              }

              /**
               * Connection did not succed - close the socket and sleep for the
               * specified amount of time before retrying.
               */
              close(sockfd);
              guac_timestamp_msleep(wait_time * 1000);
          }

          /* Failed to connect, set error message and return an error. */
          guac_error = GUAC_STATUS_REFUSED;
          guac_error_message = "Unable to connect to remote host.";
          return -1;

      }
      WOL_EOF

  - working-directory: /home/build/guacamole-server-${{package.version}}
    runs: |
      # Official-flag set from upstream's guacd Dockerfile
      # (GUACAMOLE_SERVER_OPTS): --disable-guaclog + the deprecated-declarations
      # softening (ffmpeg/freerdp3 headers trip -Werror otherwise), plus
      # -Wno-error=discarded-qualifiers (memchr-from-const-arg trips
      # -Werror=discarded-qualifiers on gcc >= 14's stricter analysis). These
      # demotions are configure ARGUMENTS, so they land in the AC_CHECK-style
      # feature probes too — including the FreeRDP probe (configure.ac
      # injects its own -Werror around it); a probe killed by a warning would
      # silently drop a protocol. Everything else is the house prefix set;
      # guacd lands in /usr/bin (Wolfi is usrmerged; melange lint rejects packaged paths under /usr/sbin), plugins in /usr/lib.
      ./configure \
        --prefix=/usr \
        --sbindir=/usr/bin \
        --localstatedir=/var \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --disable-guaclog \
        CPPFLAGS="-Wno-error=deprecated-declarations -Wno-error=discarded-qualifiers"
      # glibc >= 2.43's _GNU_SOURCE block in features.h #undef/#defines
      # _XOPEN_SOURCE 800 before config.h's bare "#define _XOPEN_SOURCE 700"
      # (from AC_DEFINE) is seen, making it a conflicting-redefinition
      # warning that upstream's per-target -Werror turns fatal (musl builds,
      # e.g. upstream's Alpine container, never hit it). Match glibc's own
      # 800 — the value feature-test selection already used — keeping every
      # other -Werror escalation intact. Guarded so a configure.ac that stops
      # emitting the define fails loudly here instead of silently.
      sed -i 's/^#define _XOPEN_SOURCE 700$/#define _XOPEN_SOURCE 800/' config.h
      grep -q '^#define _XOPEN_SOURCE 800$' config.h
      # Upstream's per-target -Werror (AM_CFLAGS in every Makefile.am) is only
      # validated against upstream's own toolchains; Wolfi gcc 16 raises whole
      # new diagnostic classes on unmodified upstream sources — dead stores
      # (surface.c 'flushed'), const-discard (string.c memchr) — each one a
      # fatal build break, and the update-versions bot must not play whack-a-
      # mole with every future gcc release. CFLAGS is automake's LAST compile
      # variable, so -Wno-error after CFLAGS demotes the AM_CFLAGS -Werror for
      # the build (warnings stay visible, real errors stay errors); the
      # configure-argument demotions above keep the feature probes exact.
      # Correctness here is guarded by the five-protocol asserts and the
      # test-pipeline boot, not by upstream's style gate. -O2 -g is autoconf's
      # own default, passed through so the override loses nothing.
      make -j"$(nproc)" CFLAGS="-O2 -g -Wno-error"

  - working-directory: /home/build/guacamole-server-${{package.version}}
    runs: |
      make install DESTDIR="${{targets.destdir}}"
      # Build-time artifacts (the frr/postgresql .la/.a prune): guacd dlopens
      # the protocol plugins, so the libtool archives/static libs only trip
      # melange's linter.
      find "${{targets.destdir}}" -name '*.la' -delete
      find "${{targets.destdir}}" -name '*.a' -delete
      # The official container's entrypoint (src/guacd-docker/bin/entrypoint.sh),
      # adopted with one Wolfi adaptation: /opt/guacamole/sbin/guacd ->
      # /usr/bin/guacd (prefix=/usr install instead of upstream's
      # /opt/guacamole relocation).
      cat > "${{targets.destdir}}/usr/bin/docker-entrypoint.sh" <<'EOF'
      #!/bin/sh
      # guacd container startup (upstream apache/guacamole-server contract):
      # listen on 0.0.0.0:4822 at info level, LOG_LEVEL (GUACD_LOG_LEVEL is the
      # deprecated name) overridable, extra `docker run` args appended verbatim.
      # Upstream entrypoint.sh, sha-pinned by tag 1.6.0, path-adapted to
      # /usr/bin/guacd.
      if [ -n "$GUACD_LOG_LEVEL" ]; then
          echo "WARNING: The GUACD_LOG_LEVEL environment variable has been deprecated in favor of the LOG_LEVEL environment variable. Please migrate your configuration when possible." >&2
      fi

      exec /usr/bin/guacd -f -b 0.0.0.0 -L "${LOG_LEVEL:-${GUACD_LOG_LEVEL:-info}}" "$@"
      EOF
      chmod 755 "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

  - runs: |
      # Verify the build actually produced this version (libguac lives in
      # destdir only, so point the loader at it — the frr pattern), and that
      # configure's auto-detection really enabled ALL FIVE protocols: each
      # protocol silently drops out when its -dev package goes missing from
      # Wolfi, which a renamed package could do without failing the build.
      export LD_LIBRARY_PATH="${{targets.destdir}}/usr/lib"
      # -v, not --version: 1.6.0's conf-args.c is plain getopt("l:b:p:L:C:K:fv")
      # and --version falls into the usage/error branch.
      v=$("${{targets.destdir}}/usr/bin/guacd" -v)
      echo "$v"
      echo "$v" | grep -q "version ${{package.version}}" || { echo "wrong version: $v"; exit 1; }
      test -x "${{targets.destdir}}/usr/bin/guacd"
      for p in rdp ssh telnet vnc kubernetes; do
        test -e "${{targets.destdir}}/usr/lib/libguac-client-$p.so" || { echo "missing protocol plugin: $p"; exit 1; }
      done
      # guacenc (the ffmpeg video re-encoder upstream ships; guaclog is
      # --disable-guaclog'd like the official image) proves ffmpeg landed.
      test -x "${{targets.destdir}}/usr/bin/guacenc"
      # The startup contract parses (the boot itself is proven by the test
      # pipeline below and by images/guacamole-server/test.sh against the final image).
      sh -n "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

test:
  environment:
    contents:
      packages:
        - busybox
        # The upstream image's own HEALTHCHECK tool (netcat-openbsd), used here
        # for the TCP probe.
        - netcat-openbsd
  pipeline:
    - runs: |
        # Boot the INSTALLED package (only runtime deps resolved from indexes —
        # proves the provider-priority resolution and the freerdp3/ffmpeg/
        # libwebsockets/... pulls). 1.6.0's option string is l:b:p:L:C:K:fv —
        # -b binds the host, -l the PORT, -p is the PIDFILE (no -P; the old
        # 0.9.x-style flags are swapped, per src/guacd/conf-args.c). guacd
        # daemonizes without -f; pidfile so the probe teardown is exact.
        guacd -b 127.0.0.1 -l 48223 -p /tmp/guacd-test.pid
        i=0
        until nc -z 127.0.0.1 48223; do
          i=$((i + 1))
          [ "$i" -gt 30 ] && { echo "guacd did not come up on 48223"; exit 1; }
          sleep 1
        done
        # A handshake-shaped probe is overkill for melange — assert the
        # listening daemon really is the installed build, then tear down.
        guacd -v | grep -q "version ${{package.version}}"
        kill "$(cat /tmp/guacd-test.pid)"
        # The daemonized server inherits this exec's stdout/stderr pipes, so
        # melange's runner only returns once it is really gone; wait it out
        # (valkey's pattern) and force-kill as fallback.
        i=0
        while pidof guacd >/dev/null; do
          i=$((i + 1))
          [ "$i" -gt 50 ] && { pkill -9 guacd; sleep 1; break; }
          sleep 0.1
        done
        for p in rdp ssh telnet vnc kubernetes; do
          test -e /usr/lib/libguac-client-$p.so || { echo "installed package lacks $p plugin"; exit 1; }
        done
        test -x /usr/bin/guacd
        test -x /usr/bin/docker-entrypoint.sh
