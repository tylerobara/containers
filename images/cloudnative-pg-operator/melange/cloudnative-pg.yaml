# Melange build for the CloudNativePG operator (github.com/cloudnative-pg/cloudnative-pg)
# — the minimal repo's traefik pattern: build the Go binary from the release
# tarball, CGO_ENABLED=0 for a fully static binary, package named exactly
# `cloudnative-pg` so grype/CPE identify it, provider-priority so we always
# win resolution. Bump `version` + `vars.sha256` on each operator release
# (https://github.com/cloudnative-pg/cloudnative-pg/releases).

package:
  name: cloudnative-pg
  version: 1.30.1
  epoch: 100
  description: "CloudNativePG operator built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: a7a814f2c5a67412de95061190772f6f297727c2a6178b0f54fbf766b8d56a59

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # go.mod wants >=1.25 / toolchain 1.26.x; Wolfi's go-1.26 covers it.
      - go-1.26

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/cloudnative-pg/cloudnative-pg/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/cnpg.tar.gz
      echo "${{vars.sha256}}  /home/build/cnpg.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf cnpg.tar.gz
      rm cnpg.tar.gz

  - working-directory: /home/build/cloudnative-pg-${{package.version}}
    runs: |
      # Mirrors `make build-manager` (plain `go build ./cmd/manager` + the
      # pkg/versions ldflags). generate/fmt/vet skipped: the generated
      # deepcopy files are committed in the release tarball.
      #
      # Upstream's image layout is NOT just /manager: the operator globs
      # CWD-relative "operator/manager_*" at startup (pkg/utils/discovery.go
      # DetectAvailableArchitectures) and the cluster reconciler FAILS the
      # whole status update if runtime.GOARCH is missing from that set
      # ("cannot update the resource status: invalid architecture: arm64").
      # So ship operator/manager_{amd64,arm64} like the upstream Dockerfile
      # (which also cross-builds both into every arch's image — pure Go,
      # CGO_ENABLED=0 makes the cross leg trivial), plus the /manager
      # entrypoint symlink to the native one.
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go-1.26/bin"
      for target in amd64 arm64; do
        GOARCH=$target go build -trimpath -buildvcs=false \
          -ldflags "-s -w \
            -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildVersion=${{package.version}} \
            -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildCommit=unknown \
            -X github.com/cloudnative-pg/cloudnative-pg/pkg/versions.buildDate=$(date -u +%FT%TZ)" \
          -o "operator/manager_$target" ./cmd/manager
        # e_machine (little-endian, byte 18): 62 = x86_64, 183 = aarch64.
        want=62; [ "$target" = arm64 ] && want=183
        got=$(od -An -j 18 -N 1 -tu1 "operator/manager_$target" | tr -d ' ')
        [ "$got" = "$want" ] || { echo "manager_$target has ELF e_machine $got, want $want"; exit 1; }
      done
      install -Dm755 operator/manager_amd64 "${{targets.destdir}}/operator/manager_amd64"
      install -Dm755 operator/manager_arm64 "${{targets.destdir}}/operator/manager_arm64"
      # Upstream: ln -sf operator/manager_${TARGETARCH} manager
      native=$(go env GOARCH)
      ln -sfn "operator/manager_$native" "${{targets.destdir}}/manager"

  - runs: |
      # Verify the build actually produced this version
      "${{targets.destdir}}/manager" version | grep -q "${{package.version}}"
