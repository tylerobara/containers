# Melange build for the Flux source-controller image
# (github.com/fluxcd/source-controller), from the release tarball with
# upstream's exact build contract (its Dockerfile): CGO_ENABLED=0,
# `go build -trimpath -a -o source-controller main.go` — and no ldflags: flux
# releases stamp NOTHING into the binary (`--version` is an unknown flag on
# the upstream images; the version only ships as an OCI annotation), so the
# version pin lives in the sha256-pinned tarball and the build-id check in
# the verify step below. Upstream copies the static binary onto alpine with
# ca-certificates; here that base is the apko config (busybox +
# ca-certificates on Wolfi, the repo-wide one-debug-shell convention).
#
# The four flux configs are four SEPARATE upstream repos with independent
# version lines — the update-versions bot bumps each one on its own.

package:
  name: source-controller
  version: 1.10.1
  epoch: 101
  description: "Flux source-controller built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: 032185dbe110d75576cc570fa0b1b5fc6b99f75ed02fbcc61771f39de8671123
  # Flag unique to this controller among the flux four; the verify step
  # greps it out of the flag dump to prove the right main package was built.
  ident_flag: helm-index-max-size
  # Transitive-dep floors the upstream lock does not carry yet, applied with
  # `go get` before the build and asserted from the embedded build info
  # below (same mechanism as gatus/traefik).
  #
  # klauspost/compress: GO-2026-6865 (High), fixed in 1.20.2; upstream
  # 1.10.1 still selects 1.20.1.
  klauspost_compress_version: 1.20.2
  # The other current match, GO-2026-6225 in
  # github.com/chrismellard/docker-credential-acr-env, has NO fix version
  # and the repo is archived (last commit Mar 2023) — it arrives through
  # the Azure credential chain in fluxcd/pkg/auth. Its Unknown severity
  # does not trip the 0-Low+ signing gate, so nothing to pin here.

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # go.mod wants go >= 1.27.0 (the 1.7.x/1.10.x line); Wolfi
      # go-1.27 satisfies the directive.
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/fluxcd/source-controller/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/sc.tar.gz
      echo "${{vars.sha256}}  /home/build/sc.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf sc.tar.gz && rm sc.tar.gz

  - working-directory: /home/build/source-controller-${{package.version}}
    runs: |
      # api/ is a submodule whose contents ship inside the release tarball
      # and which go.mod `replace`s to ./api; no vendor/, so modules resolve
      # from the network (same as the cert-manager/metallb builds).
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      # Upstream's Dockerfile line (xx-go == native go), with `.` instead of
      # `main.go` — same single-file main package, but the package-form
      # build stamps the module path into the build info grype reads.
      #   CGO_ENABLED=0 xx-go build -trimpath -a -o source-controller main.go
      # Pre-build floor: klauspost/compress only (see vars; zero-dependency
      # module, pure version lift — verified to resolve and compile against
      # the 1.10.1 tarball with go 1.27).
      go get github.com/klauspost/compress@v${{vars.klauspost_compress_version}}
      go build -trimpath -a -o source-controller .
      install -D -m 0755 source-controller \
        "${{targets.destdir}}/usr/bin/source-controller"

  - runs: |
      # Upstream has no --version flag (verified against the release image:
      # "unknown flag: --version"), so "prints its version" is asserted by
      # what the build CAN prove: the binary boots to its in-cluster config
      # step, its flag surface carries this controller's unique flag, and
      # the embedded build info is this module built from the sha-pinned
      # (== version-pinned) tarball.
      out=$(timeout 60 "${{targets.destdir}}/usr/bin/source-controller" 2>&1 || true)
      echo "$out"
      echo "$out" | grep -q "in-cluster"
      flags=$("${{targets.destdir}}/usr/bin/source-controller" --version 2>&1 || true)
      echo "$flags"
      echo "$flags" | grep -q -- "--${{vars.ident_flag}}"
      # grype reads Go deps from the embedded build info — assert it is
      # this module's binary.
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      go version -m "${{targets.destdir}}/usr/bin/source-controller" \
        | awk -F'\t' '$3=="github.com/fluxcd/source-controller"{f=1} END{exit !f}'
      # the floor must actually be in the shipped binary (a pin that
      # silently drops from the graph would re-introduce the finding)
      go version -m "${{targets.destdir}}/usr/bin/source-controller" \
        | awk -F'\t' -v want="v${{vars.klauspost_compress_version}}" \
            '$3=="github.com/klauspost/compress"{got=$4} END{exit (got == want ? 0 : 1)}'
