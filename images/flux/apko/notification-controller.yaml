# Flux notification-controller image, assembled by apko (no Dockerfile). The binary is
# built from the upstream release tarball by melange (see
# ../melange/notification-controller.yaml); everything else is Wolfi. Mirrors
# upstream's alpine + single-static-binary image (its Dockerfile copies the
# binary onto alpine with ca-certificates), with the repo-wide busybox debug
# shell instead of a bare alpine base.
#
# The flux controllers' HelmRelease/HelmChart CRDs and the install-time
# securityContext govern the containers at deploy time; 65532 only governs
# bare docker runs (upstream uses 65534).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Debug shell only — the binary is static Go. ca-certificates for the
    # OCI/Helm/HTTPS transports the sources speak.
    - busybox
    - ca-certificates
    # Built by melange; supplied via --repository-append at build time.
    - notification-controller

accounts:
  run-as: 65532

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

entrypoint:
  command: /usr/bin/notification-controller
