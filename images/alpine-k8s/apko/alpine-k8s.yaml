# alpine-k8s image, assembled by apko (no Dockerfile, nothing built from
# source — the whole image is Wolfi packages). Wolfi counterpart to
# alpine/k8s (github.com/alpine-docker/k8s): the kubectl/helm toolbox the
# minilab pipelines run. Image version = kubectl's version = the reference
# tag (alpine/k8s tags its images off the kubectl release, same here).
#
# The reference Dockerfile installs (for tag 1.37.1): kubectl at the tag,
# helm 3.x + kustomize (latest at build time), jq/yq/git/bash/curl/gettext,
# plus EKS/secrets extras — see README.md for what we deliberately skip.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # /bin/sh + coreutils (Wolfi's bash alone leaves the image without a
    # /bin/sh — same reason os-shell ships busybox)
    - busybox
    - ca-certificates
    - bash
    - curl
    - git
    # pin the kubectl minor series so the floating apko lock can never drift
    # out of the image's version line; patches flow freely, as in the
    # reference's tag builds. -default brings /usr/bin/kubectl.
    - kubectl-1.37-default
    # helm-3 is the 3.x line (what alpine/k8s:1.37.1 shipped); plain `helm`
    # now resolves to Wolfi's helm 4 and would silently break pipelines.
    - helm-3
    - kustomize
    - jq
    - yq
    # envsubst for manifest templating, as in the reference
    - gettext

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
      shell: /bin/bash
  # the reference runs as root (no USER in its Dockerfile); we follow the
  # repo-wide nonroot 65532 like os-shell — kubectl/helm need no root.
  run-as: 65532

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

# Toolbox: bare `docker run` prints kubectl usage; pipelines always set their
# own command. No entrypoint so `--entrypoint helm` style invocations work.
cmd: /usr/bin/kubectl
