# Traefik image, assembled by apko (no Dockerfile). The traefik binary is
# built from upstream source by melange (see ../melange/traefik.yaml);
# everything else is Wolfi.
#
# Reference: upstream's release Dockerfile (github.com/traefik/traefik/blob/
# main/Dockerfile): static binary + alpine, ENTRYPOINT ["/traefik"], no CMD.
# Differences from upstream, on purpose:
#   - busybox+ca-certs Wolfi base instead of alpine (no apk-tools at runtime)
#   - binary at /usr/bin/traefik (FHS) instead of /traefik; upstream's image
#     entrypoint is the plain binary anyway, so a direct /usr/bin/traefik
#     entrypoint is the same contract
#   - nonroot 65532 instead of root
#   - no dashboard UI assets (upstream release CI yarn-builds them pre-embed;
#     see melange config comment) — the API/ping endpoints are unaffected,
#     and minilab's ingress runs with --api.dashboard=false
# Traefik takes no args by default (same as upstream: no CMD) — providers and
# entrypoints come from flags/flags-files/env, e.g.
#   docker run --rm image --entrypoints.web.address=:80 --ping

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Debug shell only — traefik is a static Go binary. ca-certificates for
    # upstream TLS (ACME issuers, OCSP, cert chains).
    - busybox
    - ca-certificates
    # Built by melange; supplied via --repository-append at build time.
    - traefik

accounts:
  groups:
    - groupname: traefik
      gid: 65532
  users:
    - username: traefik
      uid: 65532
      gid: 65532
      shell: /bin/false
  run-as: 65532

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

entrypoint:
  command: /usr/bin/traefik
# apko has no per-entrypoint args (and no ports/expose fields): upstream's
# image likewise ships ENTRYPOINT ["/traefik"] with no CMD, so `docker run
# <img> <flags>` is the whole interface. Ports are whatever you declare via
# --entrypoints.*.flags (minilab ingress: web :80 / websecure :443; --ping
# serves /ping on the traefik entrypoint :8080).
