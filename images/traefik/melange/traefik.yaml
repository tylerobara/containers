# Melange build for Traefik (github.com/traefik/traefik) — from the release
# tarball with upstream's exact build contract (.goreleaser.yml.tmpl used by
# .github/workflows/release.yaml): CGO_ENABLED=0, go build -trimpath
# ./cmd/traefik, ldflags "-s -w -X pkg/version.Version=<tag>
# -X pkg/version.Codename=<CODENAME> -X pkg/version.BuildDate=<date>".
# Upstream releases stamp Codename=langres (release.yaml env CODENAME);
# Version keeps the v prefix (Makefile-style VERSION=$(git describe)).
#
# The release CI first builds the dashboard UI with yarn and drops it into
# webui/static before goreleaser; the release tarball ships webui/static as a
# placeholder, so plain go build compiles fine without node/yarn — the binary
# runs, the API works, only the dashboard HTML/JS is not embedded (same call
# as distro-style builds; minilab's ingress runs --api.dashboard=false).
# `go generate` (generate.go → internal/) only regenerates docs, skipped.
#
# Bump `version` + `vars.sha256` on each release
# (https://github.com/traefik/traefik/releases) — the update-versions bot
# covers this row. Wolfi has no traefik package today, so provider-priority/
# epoch are belt-and-suspenders in case one ever appears with the same name.

package:
  name: traefik
  version: 3.7.17
  epoch: 102
  description: "Traefik reverse proxy built from upstream source"
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: f8cffb3f7b4d5b388952e03c399ffdffaa11699033c157d7b4b4e9762d63e0c7
  # Upstream 3.7.14 pins a vulnerable Go module (grype Critical/High in
  # x/net <0.60.0); we `go get` them up to the patched releases before
  # compiling. go get only raises requirements (MVS never downgrades), so
  # once upstream ships >= these the bumps are no-ops — retire the pins then.
  # (otel 1.46.0 / grpc 1.83.2 already ship patched in go.mod.)
  # x/net 0.62.0 additionally covers GO-2026-6860 / CVE-2026-78661 (x/net/html
  # quadratic-complexity DoS on text-node coalescing, published Oct 27);
  # go-jose/v4 4.1.6 covers GHSA-mgcc-cww5-fp2q / CVE-2026-116587 (JWK RSA
  # parse DoS; same override as gatus/openbao/pocket-id, upstream still 4.1.5);
  # knative.dev/pkg pseudo 2026-05-31 covers GHSA-2hw4-cww5-fp2fj (Medium,
  # unbounded request-body memory exhaustion in admission webhooks — linked
  # via the Knative ingress provider; fix commit knative/pkg#3363, upstream
  # 3.7.16 still pins the 2025-12-16 snapshot).
  xnet_version: 0.62.0
  gojose_version: 4.1.6
  knative_pkg_version: 0.0.0-20260531000007-52dbd5ece63f
  # Release codename stamped by upstream's release CI (release.yaml).
  codename: langres

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # 3.7.17 go.mod wants go >= 1.27.0; Wolfi go-1.27 satisfies it.
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/traefik/traefik/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/traefik.tar.gz
      echo "${{vars.sha256}}  /home/build/traefik.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf traefik.tar.gz && rm traefik.tar.gz

  - working-directory: /home/build/traefik-${{package.version}}
    runs: |
      # No vendor/ in the tarball, so modules resolve from the network.
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      # Raise the vulnerable dep pin (see vars); a no-op once upstream
      # ships >= this. (Only `go build` gets build flags — `go get`
      # rejects them; upstream passes no GOFLAGS at all.)
      go get golang.org/x/net@v${{vars.xnet_version}} \
        github.com/go-jose/go-jose/v4@v${{vars.gojose_version}} \
        knative.dev/pkg@v${{vars.knative_pkg_version}}
      go build -trimpath -buildvcs=false \
        -ldflags "-s -w \
          -X github.com/traefik/traefik/v3/pkg/version.Version=v${{package.version}} \
          -X github.com/traefik/traefik/v3/pkg/version.Codename=${{vars.codename}} \
          -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u +%FT%TZ)" \
        -o traefik ./cmd/traefik
      install -Dm755 traefik "${{targets.destdir}}/usr/bin/traefik"

  - runs: |
      # Verify the build actually produced this version (`traefik version`
      # prints "Version:      v<ver>" from the ldflag stamp above).
      out=$("${{targets.destdir}}/usr/bin/traefik" version)
      echo "$out"
      echo "$out" | grep -q "v${{package.version}}"
      # grype reads Go deps from the embedded build info — assert the
      # bumped pin actually landed in the binary.
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      ver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="golang.org/x/net"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$ver" "v${{vars.xnet_version}}" | sort -V | head -1)" = "v${{vars.xnet_version}}" ] \
        || { echo "golang.org/x/net is '$ver' in the binary, want >= v${{vars.xnet_version}}"; exit 1; }
      gjver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="github.com/go-jose/go-jose/v4"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$gjver" "v${{vars.gojose_version}}" | sort -V | head -1)" = "v${{vars.gojose_version}}" ] \
        || { echo "go-jose/v4 is '$gjver' in the binary, want >= v${{vars.gojose_version}}"; exit 1; }
      kvver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="knative.dev/pkg"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$kvver" "v${{vars.knative_pkg_version}}" | sort -V | head -1)" = "v${{vars.knative_pkg_version}}" ] \
        || { echo "knative.dev/pkg is '$kvver' in the binary, want >= v${{vars.knative_pkg_version}}"; exit 1; }
