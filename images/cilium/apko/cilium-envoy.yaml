# Cilium Envoy image, assembled by apko (no Dockerfile). The static
# cilium-envoy + cilium-envoy-starter binaries come from the upstream
# published image via digest pin (../melange/cilium-envoy.yaml); the base is
# busybox on Wolfi instead of upstream's bare scratch, per repo convention
# (one debug shell in every prod image).
#
# The helm envoy-daemonset overrides command with
# /usr/bin/cilium-envoy-starter -- ... , so the entrypoint here mainly shapes
# bare `docker run` (--version prints the proxy sha/version stamp).

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - busybox
    - ca-certificates
    # envoy is linked against glibc (libc/libm + libatomic shipped inside
    # the cilium-envoy package itself).
    - glibc
    # Built by melange; supplied via --repository-append at build time.
    - cilium-envoy

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

entrypoint:
  command: /usr/bin/cilium-envoy
