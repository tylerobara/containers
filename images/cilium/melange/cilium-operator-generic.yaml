# Melange build for the cilium operator image (github.com/cilium/cilium),
# same source build as the agent config but the generic-IPAM operator
# variant, exactly as images/operator/Dockerfile builds it:
#   make GOARCH=<arch> DESTDIR=<dir> NOSTRIP=1 \
#     build-container-operator-generic install-container-binary-operator-generic
# Upstream puts it on a scratch base with ca-certs + gops; here that is the
# apko config (busybox + ca-certificates + Wolfi's gops, same 0.3.29 as
# upstream's build-gops.sh). The /home/gops scratch dir upstream chmods to
# 777 in the image ships with the package (melange cannot chown dirs).
#
# Bump `version` + `vars.sha256` on each release (in lockstep with
# cilium.yaml) — the update-versions bot covers this row.

package:
  name: cilium-operator-generic
  version: 1.20.4
  epoch: 102
  description: "Cilium operator (generic IPAM variant), built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball (same tarball as cilium.yaml)
  sha256: 90e4f8796db57542eed10f34e0a70d47b2e03f2d3767785adb5fdd66621ca7ec
  # Vendored go-jose uplift — see the patch step below (GHSA-mgcc-cww5-fp2q
  # / CVE-2026-116587 JWK parse DoS; the operator links it via registry
  # auth, the agent binary doesn't — 0 findings there, so cilium.yaml is
  # untouched). Retire once upstream's vendor tree ships >= this.
  gojose_version: 4.1.6
  # Vendored floors for the scanned Go deps (see swap step): GO-2026-6865
  # (klauspost/compress zstd panic, High) and GHSA-358w-w75h-x6rx
  # (gopacket, Medium). Keep in step with the anchors in the swap step.
  compress_version: "1.20.2"
  gopacket_version: "1.7.2"

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - make
      # The top-level Makefile needs bash (Makefile.quiet recipe) and GNU
      # coreutils, same as the agent build.
      - coreutils
      - bash
      # go.mod wants go 1.26.0; Wolfi go-1.26 is 1.26.10.
      - go-1.26

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/cilium/cilium/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/cilium.tar.gz
      echo "${{vars.sha256}}  /home/build/cilium.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf cilium.tar.gz && rm cilium.tar.gz

  - working-directory: /home/build/cilium-${{package.version}}
    runs: |
      # Vendored build, so `go get` would break vendor consistency — swap
      # the go-jose tree by hand instead. Sources come from the module
      # cache after `go mod download` verified them against sum.golang.org;
      # go-jose's go.mod has no deps and the same go directive across the
      # versions, so only the tree and its two version stamps (go.mod +
      # vendor/modules.txt) move. Fail loudly if upstream's vendored
      # version is no longer what this patch was written against.
      export GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      grep -q '^# github.com/go-jose/go-jose/v4 v4.1.4$' vendor/modules.txt \
        || { echo "vendor/modules.txt no longer pins go-jose v4.1.4; revisit this patch"; exit 1; }
      go mod download github.com/go-jose/go-jose/v4@v${{vars.gojose_version}}
      src="$(go env GOMODCACHE)/github.com/go-jose/go-jose/v4@v${{vars.gojose_version}}"
      dst="vendor/github.com/go-jose/go-jose/v4"
      rm -rf "$dst"
      cp -R "$src" "$dst"
      chmod -R u+w "$dst"
      go mod edit -require=github.com/go-jose/go-jose/v4@v${{vars.gojose_version}}
      sed -i "s|^# github.com/go-jose/go-jose/v4 v4.1.4\$|# github.com/go-jose/go-jose/v4 v${{vars.gojose_version}}|" vendor/modules.txt

  - working-directory: /home/build/cilium-${{package.version}}
    runs: |
      # Vendored floors for the scanned Go deps, same hand-swap as the
      # go-jose block above (go get would break vendor consistency).
      # Both moves are dependency-neutral — compress 1.20.2 requires
      # nothing; gopacket 1.7.2's requires (netlink v1.1.0, netns
      # 20211101, x/net 0.55.0, x/sys 0.45.0) all sit below cilium's
      # vendored stamps and its imports need no package beyond them.
      # Anchors fail loudly if upstream's vendored versions move.
      export GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      swap() {
        mod=$1 old=$2 new=$3 newgo=$4
        grep -q "^# $mod $old$" vendor/modules.txt \
          || { echo "vendor/modules.txt no longer pins $mod $old; revisit this patch"; exit 1; }
        go mod download "$mod@$new"
        rm -rf "vendor/$mod"
        cp -R "$(go env GOMODCACHE)/$mod@$new" "vendor/$mod"
        chmod -R u+w "vendor/$mod"
        go mod edit -require="$mod@$new"
        awk -v mod="$mod" -v old="$old" -v new="$new" -v newgo="$newgo" '
          $0 == "# " mod " " old { print "# " mod " " new; hit=1; next }
          hit && /^## explicit; go / { sub(/go .*/, "go " newgo); hit=0; print; next }
          hit { hit=0 }
          { print }' vendor/modules.txt > vendor/modules.txt.tmp \
          && mv vendor/modules.txt.tmp vendor/modules.txt
      }
      swap github.com/klauspost/compress v1.18.7 "v${{vars.compress_version}}" 1.25
      swap github.com/gopacket/gopacket v1.6.1 "v${{vars.gopacket_version}}" 1.25.0

  - working-directory: /home/build/cilium-${{package.version}}
    runs: |
      export GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      case "$(uname -m)" in
        x86_64)  GOARCH=amd64 ;;
        aarch64) GOARCH=arm64 ;;
        *) echo "unsupported arch $(uname -m)"; exit 1 ;;
      esac
      make GOARCH="$GOARCH" DESTDIR="${{targets.destdir}}" PKG_BUILD=1 NOSTRIP=1 \
        build-container-operator-generic install-container-binary-operator-generic

      # Upstream's image does `COPY --chmod=777 / /home/gops` for gops'
      # config drop-ins under the chart's GOPS_CONFIG_DIR=/home/gops.
      mkdir -p "${{targets.destdir}}/home/gops"
      chmod 777 "${{targets.destdir}}/home/gops"

  - runs: |
      "${{targets.destdir}}/usr/bin/cilium-operator-generic" \
        --version | grep -q "${{package.version}}"
      # grype reads Go deps from the embedded build info — fail loudly if
      # the vendored uplift didn't land in the binary.
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      gjver=$(go version -m "${{targets.destdir}}/usr/bin/cilium-operator-generic" \
        | awk -F'\t' '$3=="github.com/go-jose/go-jose/v4"{print $4; exit}')
      [ "$gjver" = "v${{vars.gojose_version}}" ] \
        || { echo "go-jose/v4 is '$gjver' in the binary, want v${{vars.gojose_version}}"; exit 1; }
      for spec in "github.com/klauspost/compress:v${{vars.compress_version}}" \
                  "github.com/gopacket/gopacket:v${{vars.gopacket_version}}"; do
        mod=${spec%:*}; want=${spec##*:}
        got=$(go version -m "${{targets.destdir}}/usr/bin/cilium-operator-generic" \
          | awk -F'\t' -v m="$mod" '$3==m{print $4; exit}')
        [ "$got" = "$want" ] || { echo "$mod is '$got' in the binary, want $want"; exit 1; }
      done
