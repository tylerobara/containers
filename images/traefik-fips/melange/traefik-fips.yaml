# Melange build for Traefik FIPS — same source/build contract as
# images/traefik (release tarball, CGO_ENABLED=0, upstream ldflags stamp),
# plus the native Go FIPS 140-3 build: GOFIPS140=v1.0.0 links the frozen,
# CMVP-validated Go Cryptographic Module (cert #5247 / CAVP A6650) into the
# binary and bakes DefaultGODEBUG=fips140=on, so FIPS mode is the default at
# runtime with no configuration. This is the same recipe Traefik's own
# commercial FIPS images use (Traefik Hub/Enterprise docs: "the official Go
# Cryptographic Module"), and the industry-standard one for Go proxies
# (flagd, GitLab, Consul all do GOFIPS140=v1.0.0 go build).
#
# Why the native module and not the alternatives:
#   - GOEXPERIMENT=boringcrypto: legacy Go+BoringCrypto, never officially
#     supported, needs cgo+BoringSSL, slated for removal from Go. Skip.
#   - golang-fips/go fork (OpenSSL backend): that route WOULD need a FIPS
#     OpenSSL in the image (the chainguard-base-fips pattern) — but it's a
#     downstream fork requiring CGO_ENABLED=1; the native module is pure Go,
#     stays static, and has the better compliance profile (go.dev/doc/security/fips140).
#   - The base image contributes no crypto here: traefik is a static Go
#     binary, so the FIPS boundary is entirely the compiled-in module; the
#     apko side stays the same minimal Wolfi base as images/traefik.
#
# Pin the literal v1.0.0 (not `certified`/`inprocess`, which resolve
# toolchain-dependently; module v1.26.0 is still pending CMVP review).
# No -tags=fips140: that enforcement tag is per-app code (flagd's own);
# traefik has none, so don't fake one — enforcement is the GOFIPS140 baked
# default, asserted below and in test.sh via go version -m.

package:
  name: traefik-fips
  version: 3.7.17
  epoch: 102
  description: "Traefik reverse proxy built from upstream source, FIPS 140-3 mode (Go Cryptographic Module v1.0.0)"
  copyright:
    - license: MIT

vars:
  # SHA256 of the GitHub release tarball (same artifact as images/traefik).
  sha256: f8cffb3f7b4d5b388952e03c399ffdffaa11699033c157d7b4b4e9762d63e0c7
  # Same dependency raises as images/traefik (grype 0-findings gate applies
  # to this image too); no-ops once upstream ships >= these.
  xnet_version: 0.62.0
  gojose_version: 4.1.6
  knative_pkg_version: 0.0.0-20260531000007-52dbd5ece63f
  codename: langres
  # Official Go toolchain tarballs (sha256 from https://go.dev/dl/?mode=json).
  # The Wolfi go-1.27 binary ships /usr/lib/go/lib/fips140/ with the
  # frozen-module zip files (and their alias .txt files) STRIPPED, leaving
  # only fips140.sum — so GOFIPS140=v1.0.0 fails "unknown GOFIPS140 version".
  # We download the upstream tarball, sha-check it, verify its fips140.sum
  # matches the Wolfi toolchain's, and copy the zips in before building.
  # Match this to the go-1.27 patch version in `environment` below.
  go_version: 1.27.3
  go_sha256_x86_64: 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40
  go_sha256_aarch64: a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # 3.7.17 go.mod wants go >= 1.27.0; Wolfi go-1.27 satisfies it. Its
      # lib/fips140 snapshots are stripped (see vars) and restored below.
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/traefik/traefik/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/traefik.tar.gz
      echo "${{vars.sha256}}  /home/build/traefik.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf traefik.tar.gz && rm traefik.tar.gz

  - working-directory: /home/build/traefik-${{package.version}}
    runs: |
      # No vendor/ in the tarball, so modules resolve from the network.
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      # Restore the frozen-module zips the Wolfi go package strips (see vars)
      # BEFORE the GOFIPS140 export below: while the zips are missing, even
      # `go env` fatal-errors on the unresolvable version. Download the pinned
      # upstream tarball for this arch, check its fips140.sum is byte-identical
      # to the Wolfi toolchain's (certifies the zips we copy belong to this
      # exact toolchain), and drop just lib/fips140 into GOROOT. The go tool
      # then checksums the zip against fips140.sum again at build time.
      goroot=$(go env GOROOT)
      case "$(uname -m)" in
        aarch64) goarch=arm64; gosha="${{vars.go_sha256_aarch64}}";;
        x86_64)  goarch=amd64; gosha="${{vars.go_sha256_x86_64}}";;
        *) echo "unsupported arch $(uname -m)"; exit 1;;
      esac
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://go.dev/dl/go${{vars.go_version}}.linux-${goarch}.tar.gz" \
        -o /tmp/go-fips.tgz
      echo "$gosha  /tmp/go-fips.tgz" | sha256sum -c -
      tar xzf /tmp/go-fips.tgz -C /tmp go/lib/fips140
      cmp /tmp/go/lib/fips140/fips140.sum "$goroot/lib/fips140/fips140.sum"
      cp /tmp/go/lib/fips140/*.zip /tmp/go/lib/fips140/*.txt "$goroot/lib/fips140/"
      # The FIPS switch: link the frozen CMVP #5247 module snapshot and bake
      # fips140=on as the runtime default (see go.dev/doc/security/fips140).
      export GOFIPS140=v1.0.0
      # Raise the vulnerable dep pins (see vars); a no-op once upstream
      # ships >= these.
      go get golang.org/x/net@v${{vars.xnet_version}} \
        github.com/go-jose/go-jose/v4@v${{vars.gojose_version}} \
        knative.dev/pkg@v${{vars.knative_pkg_version}}
      # -w but NOT -s: Chainguard's go-fips guidance keeps the symbol table
      # (helps grype/govulncheck symbol-level Go analysis and FIPS-module
      # verification); only DWARF is dropped.
      go build -trimpath -buildvcs=false \
        -ldflags "-w \
          -X github.com/traefik/traefik/v3/pkg/version.Version=v${{package.version}} \
          -X github.com/traefik/traefik/v3/pkg/version.Codename=${{vars.codename}} \
          -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u +%FT%TZ)" \
        -o traefik ./cmd/traefik
      install -Dm755 traefik "${{targets.destdir}}/usr/bin/traefik"

  - runs: |
      # Version stamp check (same as images/traefik).
      out=$("${{targets.destdir}}/usr/bin/traefik" version)
      echo "$out"
      echo "$out" | grep -q "v${{package.version}}"
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      # FIPS proof: build settings survive -trimpath and -ldflags -w; the
      # binary must carry the validated module and the fips140=on default.
      bi=$(go version -m "${{targets.destdir}}/usr/bin/traefik")
      echo "$bi" | grep -q 'build.*GOFIPS140=v1.0.0' \
        || { echo "binary lacks GOFIPS140=v1.0.0 build setting"; exit 1; }
      echo "$bi" | grep -q 'build.*DefaultGODEBUG=fips140=on' \
        || { echo "binary lacks DefaultGODEBUG=fips140=on"; exit 1; }
      # grype reads Go deps from the embedded build info — assert the
      # bumped pins actually landed in the binary.
      ver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="golang.org/x/net"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$ver" "v${{vars.xnet_version}}" | sort -V | head -1)" = "v${{vars.xnet_version}}" ] \
        || { echo "golang.org/x/net is '$ver' in the binary, want >= v${{vars.xnet_version}}"; exit 1; }
      gjver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="github.com/go-jose/go-jose/v4"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$gjver" "v${{vars.gojose_version}}" | sort -V | head -1)" = "v${{vars.gojose_version}}" ] \
        || { echo "go-jose/v4 is '$gjver' in the binary, want >= v${{vars.gojose_version}}"; exit 1; }
      kvver=$(go version -m "${{targets.destdir}}/usr/bin/traefik" \
        | awk -F'\t' '$3=="knative.dev/pkg"{print $4; exit}')
      [ "$(printf '%s\n%s\n' "$kvver" "v${{vars.knative_pkg_version}}" | sort -V | head -1)" = "v${{vars.knative_pkg_version}}" ] \
        || { echo "knative.dev/pkg is '$kvver' in the binary, want >= v${{vars.knative_pkg_version}}"; exit 1; }
