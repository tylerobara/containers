# Melange build for OpenBao (github.com/openbao/openbao) — same from-source
# pattern as the operator image: static Go binary off the release tarball,
# packaged as `openbao` so grype/secdb name-match. Wolfi has no openbao
# package today, so provider-priority/epoch are belt-and-suspenders in case
# one ever appears with the same name.
#
# Bump `version` + `vars.sha256` on each release
# (https://github.com/openbao/openbao/releases) — the update-versions bot
# covers this row.

package:
  name: openbao
  version: 2.7.1
  epoch: 102
  description: "OpenBao secrets management built from upstream source"
  copyright:
    - license: MPL-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: 4d69328fa9110734f7740547f5aa7fc77f32141eaab9f7e965abb4f748c4a81a

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # .go-version wants 1.27.1; Wolfi go-1.27 is 1.27.3.
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/openbao/openbao/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/openbao.tar.gz
      echo "${{vars.sha256}}  /home/build/openbao.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf openbao.tar.gz
      rm openbao.tar.gz

  - working-directory: /home/build/openbao-${{package.version}}
    runs: |
      # Mirrors scripts/build.sh (go build -tags openbao . -o bin/bao + the
      # internal/version ldflags); built-in plugin binaries and the web UI
      # are skipped — same as upstream's image, which ships only bao.
      # No vendor/ dir in the tarball, so modules resolve from the network.
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      # fullVersion is the unexported stamp upstream's release CI overrides
      # (scripts/build.sh alone only sets GitCommit/CommitDate; a tarball
      # build without it self-reports the dev default "2.0.0-HEAD").
      # VersionMetadata is the sanctioned downstream knob (no leading v:
      # "v" + version would double the v in `bao version`).
      go build -trimpath -buildvcs=false -tags openbao \
        -ldflags "-s -w \
          -X github.com/openbao/openbao/v2/internal/version.fullVersion=${{package.version}} \
          -X github.com/openbao/openbao/v2/internal/version.VersionMetadata=wolfi \
          -X github.com/openbao/openbao/v2/internal/version.GitCommit=unknown \
          -X github.com/openbao/openbao/v2/internal/version.CommitDate=$(date -u +%FT%TZ)" \
        -o bao .
      install -Dm755 bao "${{targets.destdir}}/usr/bin/bao"
      # Upstream ships a vault compat symlink.
      ln -sfn bao "${{targets.destdir}}/usr/bin/vault"
      # The official openbao Helm chart hardcodes this path in its server
      # command. Ship upstream's exact release entrypoint from the tarball
      # (its shebang runs dumb-init; apko adds dumb-init + su-exec), but
      # pre-patch its two unguarded chowns: /openbao/{logs,file} lack the
      # `|| echo` that upstream's config chown has, and melange cannot ship
      # nonroot-owned dirs (pipeline chown is normalized away, melange#1395)
      # — under our nonroot default user they would abort the script pre-exec.
      # The verify step below fails the build if the patch stops applying.
      install -d -m755 "${{targets.destdir}}/usr/local/bin"
      sed -e 's%chown -R openbao:openbao /openbao/logs%& || echo "Could not chown /openbao/logs (nonroot?)"%' \
          -e 's%chown -R openbao:openbao /openbao/file%& || echo "Could not chown /openbao/file (nonroot?)"%' \
          .release/docker/docker-entrypoint.sh \
        > "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"
      chmod 755 "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"
      # Upstream's data dirs (audit logs, file backend, config drop-ins);
      # root-owned is unavoidable (see above) and safe: the chart skips the
      # script's chowns via SKIP_CHOWN=true, and the patched lines merely
      # echo on nonroot failure. Mount volumes as needed and chown them.
      mkdir -p "${{targets.destdir}}/openbao/config" \
        "${{targets.destdir}}/openbao/logs" "${{targets.destdir}}/openbao/file" \
        "${{targets.destdir}}/openbao/data"

  - runs: |
      # Verify the build actually produced this version
      "${{targets.destdir}}/usr/bin/bao" version | grep -q "${{package.version}}"
      # The chart hardcodes this path; prove it's present, parseable, and
      # carries the chown-tolerance patch: 2 sed-applied lines + upstream's
      # own config line = exactly 3 `|| echo` chown guards.
      test -x "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"
      sh -n "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh"
      [ "$(grep -c '|| echo' "${{targets.destdir}}/usr/local/bin/docker-entrypoint.sh")" = 3 ] \
        || { echo "entrypoint chown patch did not apply as expected"; exit 1; }
