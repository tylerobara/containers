# Melange build for the cert-manager webhook image
# (github.com/cert-manager/cert-manager), from the release tarball with
# upstream's exact build contract (make/00_mod.mk): CGO_ENABLED=0,
# GOFLAGS=-trimpath, ldflags "-w -s -X pkg/util.AppVersion=$(VERSION)
# -X pkg/util.AppGitCommit=$(GITCOMMIT)". Upstream COPYs the static binary
# onto distroless/static (hack/containers/Containerfile.*); here that base
# is the apko config (busybox + ca-certificates on Wolfi).
#
# The three configs (controller/cainjector/webhook) share one tarball and
# move in lockstep — the update-versions bot bumps all three in a single PR.
# Bump `version` + `vars.sha256` + `vars.git_commit` only via that bot.

package:
  name: cert-manager-webhook
  version: 1.21.3
  epoch: 101
  description: "cert-manager webhook built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball (shared by all three configs)
  sha256: fa2ea8e1a014289f12d1b1c939afa4b119ee116f8a5990e4662d439e10378c3f
  # Commit behind the upstream tag; injected exactly like upstream's release
  # build so the startup banner (version/git_commit) matches it.
  git_commit: ea04791b027b1ddd1884a02043ee8c9c097fc3ac
  # Upstream 1.21.2 pins vulnerable Go modules (grype Critical/High in
  # x/net <0.60.0; Low GHSA-8wmf-6v46-5gfg in otel <=1.44.0); we `go get`
  # them up to the patched releases before compiling. go get only raises
  # requirements (MVS never downgrades), so once upstream ships >= these
  # the bumps are no-ops — retire the pins then.
  xnet_version: 0.60.0
  otel_version: 1.45.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # go.mod wants go 1.26.0; Wolfi go-1.26 is 1.26.10.
      - go-1.26

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/cert-manager/cert-manager/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/cm.tar.gz
      echo "${{vars.sha256}}  /home/build/cm.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf cm.tar.gz && rm cm.tar.gz

  - working-directory: /home/build/cert-manager-${{package.version}}/cmd/webhook
    runs: |
      # Each cmd/<binary> is its own Go module (`replace
      # github.com/cert-manager/cert-manager => ../../`), so the build runs
      # from inside it, as upstream's go-workspace-based build resolves it.
      # No vendor/ in the tarball, so modules resolve from the network
      # (same as the cilium loopback build).
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      # Raise the vulnerable dep pins (see vars); no-ops once upstream
      # ships >= these. (GOFLAGS=-trimpath stays on `go build` only —
      # `go get` rejects it.)
      go get golang.org/x/net@v${{vars.xnet_version}} \
        go.opentelemetry.io/otel@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/sdk@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/trace@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v${{vars.otel_version}}
      GOFLAGS=-trimpath go build -buildvcs=false \
        -ldflags "-w -s \
          -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=v${{package.version}} \
          -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=${{vars.git_commit}}" \
        -o cert-manager-webhook .
      install -D -m 0755 cert-manager-webhook \
        "${{targets.destdir}}/usr/bin/cert-manager-webhook"

  - runs: |
      # No --version flag upstream; the startup banner carries the ldflag
      # stamps before the binary dies on missing in-cluster config.
      out=$(timeout 60 "${{targets.destdir}}/usr/bin/cert-manager-webhook" 2>&1 || true)
      echo "$out"
      echo "$out" | grep -q "starting cert-manager webhook"
      echo "$out" | grep -q "version=\"v${{package.version}}\""
      echo "$out" | grep -q "git_commit=\"${{vars.git_commit}}\""
      # grype reads Go deps from the embedded build info — assert every
      # bumped pin actually landed in the binary.
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      for spec in \
          "golang.org/x/net v${{vars.xnet_version}}" \
          "go.opentelemetry.io/otel/sdk v${{vars.otel_version}}" \
          "go.opentelemetry.io/otel/exporters/otlp/otlptrace v${{vars.otel_version}}" \
          "go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc v${{vars.otel_version}}"; do
        set -- $spec
        ver=$(go version -m "${{targets.destdir}}/usr/bin/cert-manager-webhook" \
          | awk -F'\t' -v m="$1" '$3==m{print $4; exit}')
        [ "$(printf '%s\n%s\n' "$ver" "$2" | sort -V | head -1)" = "$2" ] \
          || { echo "$1 is '$ver' in the binary, want >= $2"; exit 1; }
      done
