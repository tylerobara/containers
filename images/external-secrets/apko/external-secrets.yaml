# External Secrets Operator image, assembled by apko (no Dockerfile). The
# binary is built from the upstream release tarball by melange (see
# ../melange/external-secrets.yaml); everything else is Wolfi. Mirrors
# upstream's distroless/static + single-binary image (its Dockerfile:
# COPY bin/external-secrets-… /bin/external-secrets, USER 65534, ENTRYPOINT
# the binary), with the repo-wide busybox debug shell instead of a bare
# scratch base and /usr/bin (FHS) instead of /bin.
#
# Upstream ships ONE image too: controller, webhook and cert-controller are
# cobra subcommands of the same binary (the helm chart spawns the same image
# with args ["webhook", …] / ["certcontroller", …]), so the "ship all the
# pieces in one image" ask is upstream's own shape, not a deviation. The
# entrypoint mirrors upstream's — the bare container runs the controller,
# exactly like upstream's ENTRYPOINT; the webhook/cert-controller Deployments
# override args the same way their chart does.
#
# run-as 65534 matches upstream's USER 65534 (nobody). The chart's pod
# securityContext (runAsNonRoot) overrides run-as at deploy time anyway;
# 65534 only governs bare docker runs.

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Debug shell only — the binary is static Go. ca-certificates for the
    # providers' outbound TLS (every cloud/vault SDK this operator calls).
    - busybox
    - ca-certificates
    # Built by melange; supplied via --repository-append at build time.
    - external-secrets

accounts:
  run-as: 65534

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

entrypoint:
  command: /usr/bin/external-secrets
# No top-level cmd: upstream's ENTRYPOINT is the bare binary (controller by
# default); webhook/cert-controller pick their mode via args, as the chart's
# webhook-deployment.yaml does (args: ["webhook", "--port=…", …]).
