# Melange build for the External Secrets Operator image
# (github.com/external-secrets/external-secrets), from the release tarball
# with upstream's exact build contract (Makefile build-%): CGO_ENABLED=0,
# `go build -tags all_providers main.go` — all providers/generators compiled
# in via pkg/register's `//go:build <name> || all_providers` files, same as
# upstream's release. Upstream stamps NOTHING into the shipped binary (no
# ldflags anywhere; VERSION only labels the image tag — the lone -X
# main.version in the tree belongs to cmd/esoctl, a separate dev CLI that
# never ships), and the binary has no --version flag. Same shape as the flux
# four: the version anchor is the sha256-pinned tarball plus the build-id and
# command-surface checks below, and the image tag carries the version.
#
# Upstream ships ONE image whose single binary serves all three deployments
# (controller = root command, webhook/certcontroller = cobra subcommands the
# helm chart passes as args). So: one package, one binary, one image — see
# the apko config header. No vendor/ in the tarball, so modules resolve from
# the network (the root go.mod local-replaces the ~118 apis/providers/
# generators submodules; same pattern as the cert-manager/cilium builds).
#
# Bump `version` + `vars.sha256` on each release via the update-versions bot
# (releases/latest returns the CHART tag, so that row filters the tag list).

package:
  name: external-secrets
  version: 2.14.0
  epoch: 100
  description: "External Secrets Operator controller/webhook/certcontroller built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: b56ec63c6991a4ed17741f68058dab857eeff1529c992947f87459afceb06aa6

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # go.mod wants go 1.27.0 (toolchain go1.27.3); Wolfi go-1.27 satisfies
      # the directive — the same upstream-bumped-past-Wolfi's-default lesson
      # the flux images hit (they also pin go-1.27).
      - go-1.27

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/external-secrets/external-secrets/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/eso.tar.gz
      echo "${{vars.sha256}}  /home/build/eso.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf eso.tar.gz && rm eso.tar.gz

  - working-directory: /home/build/external-secrets-${{package.version}}
    runs: |
      # Upstream's Makefile line, verbatim in the essentials:
      #   CGO_ENABLED=0 GOOS=linux GOARCH=$* \
      #     go build -tags all_providers -o bin/external-secrets-linux-$* main.go
      # with `-trimpath`/`-buildvcs` this repo adds and `.` instead of
      # `main.go` — the package form stamps the module path into the build
      # info grype reads (the flux-config rationale).
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      go build -trimpath -buildvcs=false -tags all_providers -o external-secrets .
      install -Dm755 external-secrets "${{targets.destdir}}/usr/bin/external-secrets"

  - runs: |
      # Upstream stamps no version and has no --version flag, so "this is the
      # right binary" is asserted by what the build CAN prove: the embedded
      # build info is this module (grype reads it; the apk version + sha-pinned
      # tarball carry the version), and the cobra surface is the upstream
      # three-mode command set — controller flags on the root, the webhook and
      # certcontroller subcommands present.
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.27/bin"
      go version -m "${{targets.destdir}}/usr/bin/external-secrets" \
        | awk -F'\t' '$2=="mod" && $3=="github.com/external-secrets/external-secrets"{f=1} END{exit !f}' \
        || { echo "binary does not embed module github.com/external-secrets/external-secrets"; exit 1; }
      help=$("${{targets.destdir}}/usr/bin/external-secrets" --help 2>&1)
      echo "$help" | grep -q "Available Commands"
      echo "$help" | grep -q "certcontroller"
      echo "$help" | grep -q -- "--controller-class"
      "${{targets.destdir}}/usr/bin/external-secrets" webhook --help 2>&1 \
        | grep -q -- "--dns-name" || { echo "webhook subcommand missing/renamed"; exit 1; }
      "${{targets.destdir}}/usr/bin/external-secrets" certcontroller --help 2>&1 \
        | grep -q -- "--service-name" || { echo "certcontroller subcommand missing/renamed"; exit 1; }
      # Controller boot must fail LOUDLY on the missing in-cluster config
      # (GetConfigOrDie) — never boot quietly out of cluster. timeout guards
      # the (unexpected) case where it hangs instead.
      out=$(timeout 60 "${{targets.destdir}}/usr/bin/external-secrets" 2>&1 || true)
      echo "$out"
      echo "$out" | grep -qi "config" || { echo "controller did not fail on the missing in-cluster config"; exit 1; }

test:
  environment:
    contents:
      packages:
        - busybox
  pipeline:
    - runs: |
        # Boot the INSTALLED package (provider-priority resolution + the
        # Wolfi runtime deps, valkey precedent): the single binary must serve
        # all three modes the chart runs — controller args, `webhook`, and
        # `certcontroller`.
        external-secrets --help | grep -q "certcontroller"
        external-secrets webhook --help | grep -q -- "--dns-name"
        external-secrets certcontroller --help | grep -q -- "--service-name"
        # Bare controller run with no kube config must exit non-zero loudly.
        external-secrets >/dev/null 2>&1 && { echo "controller booted without a kube config"; exit 1; }
