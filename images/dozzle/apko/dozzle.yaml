# Dozzle image, assembled by apko (no Dockerfile). The dozzle binary — web UI
# embedded — is built from upstream source by melange
# (see ../melange/dozzle.yaml); everything else is Wolfi.
#
# Reference: the scratch stage of the upstream Dockerfile
# (github.com/amir20/dozzle/blob/main/Dockerfile): static binary + CA certs,
# entrypoint is the binary with no args = the web server on :8080.
# Differences from upstream, on purpose:
#   - busybox+ca-certs Wolfi base instead of bare scratch (debug shell)
#   - nonroot 65532 instead of root
#   - the server reads the container runtime socket (mount
#     /var/run/docker.sock or use --remote-host/--remote-agent)

contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    # Debug shell only — dozzle is a static Go binary with the UI embedded.
    # ca-certificates for registry/remote-endpoint TLS; no tzdata: the
    # binary imports time/tzdata (embedded zoneinfo).
    - busybox
    - ca-certificates
    # Built by melange; supplied via --repository-append at build time.
    - dozzle

accounts:
  groups:
    - groupname: dozzle
      gid: 65532
  users:
    - username: dozzle
      uid: 65532
      gid: 65532
      shell: /bin/false
  run-as: 65532

environment:
  PATH: /usr/sbin:/sbin:/usr/bin:/bin

entrypoint:
  command: /usr/bin/dozzle
# apko has no ports/expose fields: :8080 (the DOZZLE_ADDR default) is just
# the usual listen address. No top-level cmd — the bare binary is upstream's
# server entrypoint; `docker run <img> healthcheck` etc. still override.
