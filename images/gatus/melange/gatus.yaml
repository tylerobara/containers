# Melange build for Gatus (github.com/TwiN/gatus) — same from-source pattern
# as the metallb family: static Go binary off the release tarball, packaged
# as `gatus` so grype/secdb name-match. Wolfi ships its own `gatus` package
# (its build config was removed from the wolfi-dev/os tree, but the packages
# stay in the live index through 5.36.0-r4), so provider-priority/epoch keep
# same-version Wolfi pkgs from winning resolution — and the pinned version
# must stay AT OR ABOVE the highest Wolfi index version (5.36.0), because a
# plain higher version beats our -r100 release counter. That rules out the
# 5.34.0 cluster reference tag and is why this pins 5.37.0.
#
# Upstream's build contract (its Dockerfile: CGO_ENABLED=0 go build -o gatus .
# on golang:alpine, then scratch + /gatus + config/config.yaml + ENTRYPOINT)
# stamps nothing: no ldflags, no --version flag, no startup banner — main.go
# does zero flag parsing and no string in the tree carries the version. So the
# version anchor is the sha256-pinned tarball plus the build-info + boot
# assertions in the verify step below.
#
# Bump `version` + `vars.sha256` on each release
# (https://github.com/TwiN/gatus/releases) — the update-versions bot covers
# this row.

package:
  name: gatus
  version: 5.37.0
  epoch: 100
  description: "Gatus health monitor and status page built from upstream source"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 100

vars:
  # SHA256 of the GitHub release tarball
  sha256: a58ddb7052086218f404185803d3423be3985aa7b8f4f3c7ab4444a7b307fcf8
  # Upstream 5.37.0 pins vulnerable Go modules (grype Critical/High in
  # x/net <0.60.0; High in grpc <1.83.1/1.83.2 (GHSA-2v4p-qf9q-27wj,
  # GHSA-vp52-pcj8-j9qc); Low GHSA-8wmf-6v46-5gfg in otel <=1.44.0; x/crypto
  # 0.57.0 covers CVE-2026-39821, the same floor Wolfi's own gatus build
  # bumped to for its -r4; x/net 0.60.0 additionally requires crypto >=0.57);
  # we `go get` them up to the patched releases before compiling. go get only
  # raises requirements (MVS never downgrades), so once upstream ships >=
  # these the bumps are no-ops — retire the pins then.
  xnet_version: 0.60.0
  xcrypto_version: 0.57.0
  otel_version: 1.45.0
  grpc_version: 1.83.2

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      # go.mod wants go 1.26.3; Wolfi go-1.26 satisfies the directive — same
      # choice as the metallb family (and as Wolfi's own gatus build).
      - go-1.26

pipeline:
  - runs: |
      mkdir -p /home/build
      curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors \
        "https://github.com/TwiN/gatus/archive/refs/tags/v${{package.version}}.tar.gz" \
        -o /home/build/gatus.tar.gz
      echo "${{vars.sha256}}  /home/build/gatus.tar.gz" | sha256sum -c -
      cd /home/build
      tar xf gatus.tar.gz && rm gatus.tar.gz

  - working-directory: /home/build/gatus-${{package.version}}
    runs: |
      # No vendor/ dir in the tarball, so modules resolve from the network
      # (upstream's Dockerfile builds untidy too). Upstream passes no build
      # ldflags at all; -trimpath/-buildvcs are this repo's conventions.
      export CGO_ENABLED=0 GOTOOLCHAIN=local
      export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
      # Raise the vulnerable dep pins (see vars); no-ops once upstream
      # ships >= these. (Only `go build` gets build flags — `go get`
      # rejects them; upstream passes no GOFLAGS at all.)
      go get golang.org/x/net@v${{vars.xnet_version}} \
        golang.org/x/crypto@v${{vars.xcrypto_version}} \
        google.golang.org/grpc@v${{vars.grpc_version}} \
        go.opentelemetry.io/otel@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/metric@v${{vars.otel_version}} \
        go.opentelemetry.io/otel/trace@v${{vars.otel_version}}
      go build -trimpath -buildvcs=false -o gatus .
      install -Dm755 gatus "${{targets.destdir}}/usr/bin/gatus"
      # Upstream's scratch image bakes the repo-root config.yaml as the live
      # config; we ship it read-only as an example instead — the apko config
      # points GATUS_CONFIG_PATH at /etc/gatus/config.yaml, which you mount
      # yourself (production posture, same as openbao here).
      install -Dm644 config.yaml "${{targets.destdir}}/etc/gatus/config.yaml.example"

  - runs: |
       export PATH="$PATH:/usr/lib/go/bin:/usr/lib/go-1.26/bin"
       # gatus self-reports nothing (no --version flag, no banner), so the
       # version anchor is the sha256-checked tarball; here we prove module
       # identity, the dep pins and that the server actually boots.
       test -x "${{targets.destdir}}/usr/bin/gatus"
       go version -m "${{targets.destdir}}/usr/bin/gatus" \
         | awk -F'\t' '$2=="mod" && $3=="github.com/TwiN/gatus/v5"{f=1} END{exit !f}' \
         || { echo "binary does not embed module github.com/TwiN/gatus/v5"; exit 1; }
       # grype reads Go deps from the embedded build info — assert every
       # bumped pin actually landed in the binary.
       for spec in \
           "golang.org/x/net v${{vars.xnet_version}}" \
           "golang.org/x/crypto v${{vars.xcrypto_version}}" \
           "go.opentelemetry.io/otel v${{vars.otel_version}}" \
           "go.opentelemetry.io/otel/metric v${{vars.otel_version}}" \
           "go.opentelemetry.io/otel/trace v${{vars.otel_version}}" \
           "google.golang.org/grpc v${{vars.grpc_version}}"; do
         set -- $spec
         ver=$(go version -m "${{targets.destdir}}/usr/bin/gatus" \
           | awk -F'\t' -v m="$1" '$3==m{print $4; exit}')
         [ "$(printf '%s\n%s\n' "$ver" "$2" | sort -V | head -1)" = "$2" ] \
           || { echo "$1 is '$ver' in the binary, want >= $2"; exit 1; }
       done
       # Functional boot with the shipped example config: the web server must
       # come up on its default 0.0.0.0:8080. timeout kills it once it has;
       # failed endpoint checks (e.g. the icmp ping under nonroot) are fine.
       out=$(GATUS_CONFIG_PATH="${{targets.destdir}}/etc/gatus/config.yaml.example" \
         timeout 30 "${{targets.destdir}}/usr/bin/gatus" 2>&1 || true)
       echo "$out"
       echo "$out" | grep -q "Listening on 0.0.0.0:8080" \
         || { echo "gatus did not bring up the web server"; exit 1; }
