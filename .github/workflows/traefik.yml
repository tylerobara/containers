name: traefik

# Builds + publishes the Traefik images: the plain image plus its FIPS 140-3
# sibling, as a `variant` matrix over the two melange/apko recipes
# (images/traefik + images/traefik-fips, which share the tarball and pins —
# see images/traefik-fips/README.md). The FIPS variant publishes as -fips
# SUFFIX TAGS on the same traefik image, a drop-in sibling of the plain tags.
# Binaries built from upstream source by melange, assembled by apko on Wolfi,
# no Dockerfile. One workflow per image family; routing is the native
# on.push.paths filter.
# cosign identity = THIS file — both variants sign under it (a variant needs
# its own workflow file for its own identity; the -fips crypto provenance is
# instead carried by the embedded build info GOFIPS140=v1.0.0 + the distinct
# traefik-fips package in the SBOM, asserted in the melange pipeline):
#   cosign verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/tylerobara/containers/\.github/workflows/traefik\.yml@refs/heads/main$' \
#     ghcr.io/tylerobara/containers/traefik[:<tag>[-fips]]
# PRs run everything except publish/sign/pages; validate a bot bump PR via
# workflow_dispatch (ref = bump branch, validate_only checked).

on:
  push:
    branches: [main]
    paths:
      - images/traefik/**
      - images/traefik-fips/**
      - .github/workflows/traefik.yml
  pull_request:
    branches: [main]
    paths:
      - images/traefik/**
      - images/traefik-fips/**
      - .github/workflows/traefik.yml
  schedule:
    - cron: '20 7 * * *' # daily, staggered off postgres + operator
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the branch dispatched from). Use a bump-PR branch to validate it."
        required: false
        default: ""
      validate_only:
        description: "Build + scan without publishing/signing/deploying pages"
        type: boolean
        default: false

concurrency:
  group: traefik-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  MELANGE_VERSION: v0.63.0

permissions:
  contents: read
  packages: write

jobs:
  # No detect job: the on.push.paths trigger above IS the routing — if this
  # workflow ran at all, traefik, traefik-fips, or this file changed. Editing
  # either family rebuilds both variants; the FIPS melange build shares the
  # plain build's module cache warmth anyway and the 4-way matrix is the
  # price of one keygen, one schedule and one cosign identity.

  keygen:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      priv: ${{ steps.k.outputs.priv }}
    steps:
      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Generate key
        id: k
        run: |
          ~/go/bin/melange keygen
          { echo "pub=$(base64 -w0 melange.rsa.pub)"; echo "priv=$(base64 -w0 melange.rsa)"; } >> "$GITHUB_OUTPUT"

  melange:
    needs: keygen
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [plain, fips]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - variant: plain
            melange_config: images/traefik/melange/traefik.yaml
          - variant: fips
            melange_config: images/traefik-fips/melange/traefik-fips.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build traefik (${{ matrix.variant }}/${{ matrix.arch }})
        run: |
          ~/go/bin/melange build ${{ matrix.melange_config }} \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-traefik-${{ matrix.variant }}-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  build:
    needs: [keygen, melange]
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, fips]
        include:
          - variant: plain
            melange_config: images/traefik/melange/traefik.yaml
            apko_config: images/traefik/apko/traefik.yaml
            package: traefik
            suffix: ""
            test_script: images/traefik/test.sh
            scan_name: traefik.json
            pages_name: pages-data-traefik
            major: null
          - variant: fips
            melange_config: images/traefik-fips/melange/traefik-fips.yaml
            apko_config: images/traefik-fips/apko/traefik-fips.yaml
            package: traefik-fips
            suffix: "-fips"
            test_script: images/traefik-fips/test.sh
            scan_name: traefik-fips.json
            pages_name: pages-data-traefik-fips
            major: fips
    env:
      TRAEFIK_IMAGE: ghcr.io/${{ github.repository }}/traefik
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-traefik-${{ matrix.variant }}-*
          path: .
          merge-multiple: true

      - name: Resolve pinned version + version guard
        run: |
          VER=$(awk '/^  version:/{print $2; exit}' ${{ matrix.melange_config }})
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' ${{ matrix.melange_config }})
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "TRAEFIK_VER=$VER" >> "$GITHUB_ENV"
          echo "TRAEFIK_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/${{ matrix.apko_config }} \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output /work/traefik-${{ matrix.variant }}.lock.json
          RESOLVED=$(jq -r '.contents.packages[] | select(.name=="${{ matrix.package }}") | .version' traefik-${{ matrix.variant }}.lock.json | head -1)
          # exact pkgver match or the melange package lost resolution to Wolfi
          if [ "$RESOLVED" != "${VER}-r${EPOCH}" ]; then
            echo "apko resolved ${{ matrix.package }} as '$RESOLVED', expected '${VER}-r${EPOCH}'"; exit 1
          fi

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch traefik image to ghcr (${{ matrix.variant }})
        if: env.PUBLISH == 'true'
        run: |
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD:/work:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish /work/${{ matrix.apko_config }} \
                "$TRAEFIK_IMAGE:$TRAEFIK_VER${{ matrix.suffix }}" "$TRAEFIK_IMAGE:$TRAEFIK_MINOR${{ matrix.suffix }}" "$TRAEFIK_IMAGE:latest${{ matrix.suffix }}" \
                --arch x86_64,aarch64 \
                --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
                --lockfile /work/traefik-${{ matrix.variant }}.lock.json; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "TRAEFIK_REF=$TRAEFIK_IMAGE:$TRAEFIK_VER${{ matrix.suffix }}" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$TRAEFIK_IMAGE:$TRAEFIK_VER${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish /work/${{ matrix.apko_config }} \
              "traefik:validate${{ matrix.suffix }}" \
              --arch x86_64 \
              --local \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub
          echo "TRAEFIK_REF=traefik:validate${{ matrix.suffix }}" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:traefik:validate${{ matrix.suffix }}" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$TRAEFIK_REF"
          IMAGE="$TRAEFIK_REF" VERSION="$TRAEFIK_VER" ./${{ matrix.test_script }}

      - name: Scan image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file /out/${{ matrix.scan_name }} || true
          # Same signing gate as every other image here: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/${{ matrix.scan_name }})
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.package }} Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$TRAEFIK_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$TRAEFIK_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$TRAEFIK_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          # major: null for the plain entry, "fips" for the -fips companion
          # (site.yml keys entries on image+major, so the two coexist and the
          # site renders the companion as the FIPS tag set on traefik's page).
          jq -n \
            --arg image "$TRAEFIK_IMAGE" --arg version "$TRAEFIK_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$TRAEFIK_VER${{ matrix.suffix }} $TRAEFIK_MINOR${{ matrix.suffix }} latest${{ matrix.suffix }}" \
            --arg majorstr "${{ matrix.major }}" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --arg signed_by traefik.yml \
            --slurpfile scan scans/${{ matrix.scan_name }} \
            '{image: $image,
              major: (if $majorstr == "null" then null else $majorstr end),
              version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed, signed_by: $signed_by,
              scan: $scan[0]}' > scans/${{ matrix.scan_name }}.tmp
          mv scans/${{ matrix.scan_name }}.tmp scans/${{ matrix.scan_name }}

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: ${{ matrix.pages_name }}
          path: scans/${{ matrix.scan_name }}

  pages:
    # Merge this run's fresh entries over the live index (sibling entries are
    # preserved, keyed on image+major with fresh entries winning), rebuild the
    # Astro site and deploy — see site.yml. Covers both variants' entries in
    # one deploy: plain (major null) + fips companion (major "fips").
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [build]
    permissions:
      contents: write # push the generated gh-pages branch
    uses: ./.github/workflows/site.yml
    with:
      artifact-pattern: pages-data-traefik*
      ref: ${{ inputs.ref || github.ref }}
