name: os-shell

# Builds + publishes the os-shell image (bitnami os-shell counterpart: pure
# Wolfi packages assembled by apko — no melange, no Dockerfile, so there is
# no keygen/melange stage and no per-arch build leg; apko publishes both
# arches in one shot). One workflow per image family; routing is the native
# on.push.paths filter.
# cosign identity = THIS file:
#   cosign verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/tylerobara/containers/\.github/workflows/os-shell\.yml@refs/heads/main$' \
#     ghcr.io/tylerobara/containers/os-shell:<tag>
# PRs run everything except publish/sign/pages; validate via workflow_dispatch
# (ref = branch, validate_only checked).

on:
  push:
    branches: [main]
    paths:
      - images/os-shell/**
      - .github/workflows/os-shell.yml
  pull_request:
    branches: [main]
    paths:
      - images/os-shell/**
      - .github/workflows/os-shell.yml
  schedule:
    - cron: '15 6 * * *' # daily; the real security cadence — apko lock floats
                         # to current Wolfi, so patches flow without a commit
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the branch dispatched from)."
        required: false
        default: ""
      validate_only:
        description: "Build + scan without publishing/signing/deploying pages"
        type: boolean
        default: false

concurrency:
  group: os-shell-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # No detect job and no melange/keygen legs: the on.push.paths trigger is the
  # routing, and there is nothing to compile — one apko build job does it all.

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      OSSH_IMAGE: ghcr.io/${{ github.repository }}/os-shell
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve pinned version + version guard
        run: |
          VER=$(tr -d '[:space:]' < images/os-shell/VERSION)
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "OSSH_VER=$VER" >> "$GITHUB_ENV"
          echo "OSSH_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          # Lock once and publish from that lock (same as the sibling images).
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/images/os-shell/apko/os-shell.yaml \
              --arch x86_64 --arch aarch64 \
              --output /work/os-shell.lock.json

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch os-shell image to ghcr
        if: env.PUBLISH == 'true'
        run: |
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD:/work:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish /work/images/os-shell/apko/os-shell.yaml \
                "$OSSH_IMAGE:$OSSH_VER" "$OSSH_IMAGE:$OSSH_MINOR" "$OSSH_IMAGE:latest" \
                --arch x86_64,aarch64 \
                --lockfile /work/os-shell.lock.json; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "OSSH_REF=$OSSH_IMAGE:$OSSH_VER" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$OSSH_IMAGE:$OSSH_VER" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish /work/images/os-shell/apko/os-shell.yaml \
              "os-shell:validate" \
              --arch x86_64 \
              --local
          echo "OSSH_REF=os-shell:validate" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:os-shell:validate" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$OSSH_REF"
          IMAGE="$OSSH_REF" VERSION="$OSSH_VER" ./images/os-shell/test.sh

      - name: Scan image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file /out/os-shell.json || true
          # Same signing gate as every other image here: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/os-shell.json)
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "os-shell Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OSSH_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$OSSH_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OSSH_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$OSSH_IMAGE" --arg version "$OSSH_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$OSSH_VER $OSSH_MINOR latest" \
            --arg built_with apko --argjson signed "${SIGNED:-false}" \
            --arg signed_by os-shell.yml \
            --slurpfile scan scans/os-shell.json \
            '{image: $image, major: null, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed, signed_by: $signed_by,
              scan: $scan[0]}' > scans/os-shell.json.tmp
          mv scans/os-shell.json.tmp scans/os-shell.json

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: pages-data-os-shell
          path: scans/os-shell.json

  pages:
    # Merge this run's fresh entries over the live index (sibling entries are
    # preserved, keyed on image+major with fresh entries winning), rebuild the
    # Astro site and deploy — see site.yml.
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [build]
    permissions:
      contents: write # push the generated gh-pages branch
    uses: ./.github/workflows/site.yml
    with:
      artifact-pattern: pages-data-os-shell
      ref: ${{ inputs.ref || github.ref }}
