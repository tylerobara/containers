name: traefik-fips

# Builds + publishes the Traefik FIPS image (FIPS 140-3 traefik binary built
# from upstream source by melange with GOFIPS140=v1.0.0, assembled by apko on
# Wolfi, no Dockerfile). Published as -fips SUFFIX TAGS on the existing traefik
# image (ghcr.io/tylerobara/containers/traefik:<ver>-fips etc.), a drop-in
# sibling of the plain tags — see images/traefik-fips/README.md.
# Routing is the native on.push.paths filter; PRs run everything except
# publish/sign (validate a branch via workflow_dispatch, validate_only).
# cosign identity = THIS file:
#   cosign verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/tylerobara/containers/\.github/workflows/traefik-fips\.yml@refs/heads/main$' \
#     ghcr.io/tylerobara/containers/traefik:<tag>-fips
# Pages data: publishes a companion index entry keyed major:"fips" (site.yml
# keys entries on image+major, so it coexists with traefik.yml's major:null
# entry); site/src renders it as the FIPS tag set on traefik's Tags tab.

on:
  push:
    branches: [main]
    paths:
      - images/traefik-fips/**
      - .github/workflows/traefik-fips.yml
  pull_request:
    branches: [main]
    paths:
      - images/traefik-fips/**
      - .github/workflows/traefik-fips.yml
  schedule:
    - cron: '40 7 * * *' # daily, staggered off traefik.yml's 20 7
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the branch dispatched from). Use a bump-PR branch to validate it."
        required: false
        default: ""
      validate_only:
        description: "Build + scan without publishing/signing/deploying pages"
        type: boolean
        default: false

concurrency:
  group: traefik-fips-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  MELANGE_VERSION: v0.63.0

permissions:
  contents: read
  packages: write

jobs:
  keygen:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      priv: ${{ steps.k.outputs.priv }}
    steps:
      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Generate key
        id: k
        run: |
          ~/go/bin/melange keygen
          { echo "pub=$(base64 -w0 melange.rsa.pub)"; echo "priv=$(base64 -w0 melange.rsa)"; } >> "$GITHUB_OUTPUT"

  melange:
    needs: keygen
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build traefik-fips (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/traefik-fips/melange/traefik-fips.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-traefik-fips-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  build:
    needs: [keygen, melange]
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      TRAEFIK_IMAGE: ghcr.io/${{ github.repository }}/traefik
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-traefik-fips-*
          path: .
          merge-multiple: true

      - name: Resolve pinned version + version guard
        run: |
          VER=$(awk '/^  version:/{print $2; exit}' images/traefik-fips/melange/traefik-fips.yaml)
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' images/traefik-fips/melange/traefik-fips.yaml)
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "TRAEFIK_VER=$VER" >> "$GITHUB_ENV"
          echo "TRAEFIK_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/images/traefik-fips/apko/traefik-fips.yaml \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output /work/traefik-fips.lock.json
          RESOLVED=$(jq -r '.contents.packages[] | select(.name=="traefik-fips") | .version' traefik-fips.lock.json | head -1)
          # exact pkgver match or the melange package lost resolution to Wolfi
          if [ "$RESOLVED" != "${VER}-r${EPOCH}" ]; then
            echo "apko resolved traefik-fips as '$RESOLVED', expected '${VER}-r${EPOCH}'"; exit 1
          fi

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch traefik -fips tags to ghcr
        if: env.PUBLISH == 'true'
        run: |
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD:/work:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish /work/images/traefik-fips/apko/traefik-fips.yaml \
                "$TRAEFIK_IMAGE:$TRAEFIK_VER-fips" "$TRAEFIK_IMAGE:$TRAEFIK_MINOR-fips" "$TRAEFIK_IMAGE:latest-fips" \
                --arch x86_64,aarch64 \
                --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
                --lockfile /work/traefik-fips.lock.json; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "TRAEFIK_REF=$TRAEFIK_IMAGE:$TRAEFIK_VER-fips" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$TRAEFIK_IMAGE:$TRAEFIK_VER-fips" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish /work/images/traefik-fips/apko/traefik-fips.yaml \
              "traefik:validate-fips" \
              --arch x86_64 \
              --local \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub
          echo "TRAEFIK_REF=traefik:validate-fips" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:traefik:validate-fips" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$TRAEFIK_REF"
          IMAGE="$TRAEFIK_REF" VERSION="$TRAEFIK_VER" ./images/traefik-fips/test.sh

      - name: Scan image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file /out/traefik-fips.json || true
          # Same signing gate as every other image here: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/traefik-fips.json)
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "traefik-fips Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$TRAEFIK_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$TRAEFIK_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$TRAEFIK_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$TRAEFIK_IMAGE" --arg version "$TRAEFIK_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$TRAEFIK_VER-fips $TRAEFIK_MINOR-fips latest-fips" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --arg signed_by traefik-fips.yml \
            --slurpfile scan scans/traefik-fips.json \
            '{image: $image, major: "fips", version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed, signed_by: $signed_by,
              scan: $scan[0]}' > scans/traefik-fips.json.tmp
          mv scans/traefik-fips.json.tmp scans/traefik-fips.json

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: pages-data-traefik-fips
          path: scans/traefik-fips.json

  pages:
    # Merge the fresh major:"fips" entry over the live index and redeploy —
    # traefik.yml's own entry is preserved (different image+major key).
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    needs: [build]
    permissions:
      contents: write # push the generated gh-pages branch
    uses: ./.github/workflows/site.yml
    with:
      artifact-pattern: pages-data-traefik-fips
      ref: ${{ inputs.ref || github.ref }}
