name: update-versions

# Version bump bot — the minimal repo's update-versions.yml pattern scaled to
# this repo's image families. Checks upstream (PGDG ftp for each tracked
# postgresql-<major>.yaml, GitHub releases for the operator, openbao, homepage,
# dokuwiki, grafana-image-renderer, cilium, cert-manager, frr-k8s, k8s-sidecar,
# local-path-provisioner and gatus;
# cilium-envoy follows cilium's own images/cilium/Dockerfile pin and gets its
# payload shas re-extracted; metallb's controller + speaker configs are bumped
# together off the latest non-chart metallb tag) and
# opens a PR bumping `version` + `vars.sha256` in the melange config. Nothing
# is merged or published here: review the PR, validate it with that image's
# own workflow (postgres / cloudnative-pg-operator / openbao / homepage / dokuwiki /
# grafana-image-renderer / cert-manager / metallb / k8s-sidecar / local-path-provisioner / gatus) via
# workflow_dispatch (ref = PR branch, validate_only = true),
# then merge — the merge push rebuilds and publishes just that image.
#
# GITHUB_TOKEN-authored PRs don't auto-run checks (GitHub's anti-recursion
# rule). If you install a GitHub App and set APP_ID/APP_PRIVATE_KEY secrets,
# swap in actions/create-github-app-token and bot PRs get CI for free.

on:
  schedule:
    - cron: '30 7 * * *' # after the 06:00 daily rebuild
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated rows to check, e.g. postgresql-16,operator,openbao,cilium,cilium-envoy,metallb,frr-k8s,k8s-sidecar,local-path-provisioner,gatus,homepage (blank = all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      # git commit needs an identity; scheduled runs have none on the runner
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check upstream and open bump PRs
        run: |
          set -uo pipefail
          ONLY="${{ inputs.only }}"
          FAILED=0

          want() { # want <name> — honour the `only:` filter
            if [ -z "${ONLY// /}" ]; then return 0; fi
            echo ",${ONLY// /}," | grep -qi ",$1,"
          }

          bump_row() { # bump_row <name> <yaml-path> <latest> <tarball-url> <validating-workflow>
            local name=$1 yaml=$2 latest=$3 url=$4 wf=$5
            local cur branch sha
            cur=$(awk '/^  version:/{print $2; exit}' "$yaml")
            # only ever move forward (guards against ftp page noise)
            if [ "$(printf '%s\n%s\n' "$cur" "$latest" | sort -V | tail -1)" != "$latest" ] || [ "$cur" = "$latest" ]; then
              echo "$name: already at or ahead of $latest, skip"
              return 0
            fi

            if ! sha=$(curl -fsSL --retry 3 "$url" | sha256sum | awk '{print $1}'); then
              echo "::error::$name: could not download $url"
              FAILED=1
              return 0
            fi

            # First version: key inside package{}; first sha256: key is vars.sha256
            sed -i "0,/^  version: /s/^  version: .*/  version: $latest/" "$yaml"
            sed -i "0,/^  sha256: /s/^  sha256: .*/  sha256: $sha/" "$yaml"
            # round-trip guard: the edit must land exactly
            if [ "$(awk '/^  version:/{print $2; exit}' "$yaml")" != "$latest" ] || [ "$(awk '/^  sha256:/{print $2; exit}' "$yaml")" != "$sha" ]; then
              echo "::error::$name: yaml edit did not land as expected"
              FAILED=1
              git checkout -- "$yaml"
              return 0
            fi

            branch="bump/$name-$latest"
            git switch -c "$branch"
            git add "$yaml"
            git commit -m "chore($name): bump $cur -> $latest"
            git push -f origin "$branch"

            if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
              echo "$name: pushed update to existing PR for $branch"
            else
              gh pr create --head "$branch" --base main \
                --title "chore($name): bump $cur -> $latest" \
                --body "**$name** \`$cur\` -> \`$latest\` (detected by the update-versions bot).

          - melange config: \`$yaml\` (\`version\` + \`vars.sha256\` bumped; \`epoch: 100\` untouched — it stays above any Wolfi -rN)
          - upstream tarball hashed into the config: <$url>
          - \`sha256\`: \`$sha\`

          Bot PRs don't get automatic CI checks. To validate before merging, run **$wf.yml → Run workflow** with \`ref=$branch\` and **validate_only** checked: it builds, assembles and grype-scans this branch without publishing or signing anything. The merge push to main then publishes only this image." || FAILED=1
            fi
            echo "$name: opened/updated bump PR $cur -> $latest" >> "$GITHUB_STEP_SUMMARY"
            # back to the pristine baseline for the next row
            git switch -C scratch-"$branch" origin/main >/dev/null 2>&1
          }

          # --- postgresql-<major>: newest minor from the PGDG ftp listing ---
          for yaml in images/cloudnative-pg/melange/postgresql-*.yaml; do
            major=$(basename "$yaml" .yaml); major=${major#postgresql-}
            want "postgresql-$major" || continue
            latest=$(curl -fsSL --retry 3 https://www.postgresql.org/ftp/source/ \
              | grep -oE "v${major}\.[0-9]+/" | tr -d 'v/' | sort -V | tail -1)
            if [ -z "$latest" ]; then
              echo "::error::postgresql-$major: no release found upstream"
              FAILED=1
              continue
            fi
            bump_row "postgresql-$major" "$yaml" "$latest" \
              "https://ftp.postgresql.org/pub/source/v${latest}/postgresql-${latest}.tar.bz2" \
              postgres
          done

          # --- operator: latest GitHub release ---
          if want operator; then
            yaml=images/cloudnative-pg-operator/melange/cloudnative-pg.yaml
            latest=$(gh api repos/cloudnative-pg/cloudnative-pg/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::operator: no release found upstream"
              FAILED=1
            fi
            bump_row operator "$yaml" "$latest" \
              "https://github.com/cloudnative-pg/cloudnative-pg/archive/refs/tags/v${latest}.tar.gz" \
              cloudnative-pg-operator
          fi

          # --- openbao: latest GitHub release ---
          if want openbao; then
            yaml=images/openbao/melange/openbao.yaml
            latest=$(gh api repos/openbao/openbao/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::openbao: no release found upstream"
              FAILED=1
            fi
            bump_row openbao "$yaml" "$latest" \
              "https://github.com/openbao/openbao/archive/refs/tags/v${latest}.tar.gz" \
              openbao
          fi

          # --- homepage: latest GitHub release ---
          if want homepage; then
            yaml=images/homepage/melange/homepage.yaml
            latest=$(gh api repos/gethomepage/homepage/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::homepage: no release found upstream"
              FAILED=1
            fi
            bump_row homepage "$yaml" "$latest" \
              "https://github.com/gethomepage/homepage/archive/refs/tags/v${latest}.tar.gz" \
              homepage
          fi

          # --- dokuwiki: latest GitHub release (release-2026-07-14c -> 2026.07.14c) ---
          if want dokuwiki; then
            yaml=images/dokuwiki/melange/dokuwiki.yaml
            latest=$(gh api repos/dokuwiki/dokuwiki/releases/latest --jq '.tag_name' \
              | sed 's/^release-//' | tr '-' '.')
            if [ -z "$latest" ]; then
              echo "::error::dokuwiki: no release found upstream"
              FAILED=1
            fi
            # download server filenames keep the dashed release form
            bump_row dokuwiki "$yaml" "$latest" \
              "https://download.dokuwiki.org/src/dokuwiki/dokuwiki-$(printf '%s' "$latest" | tr '.' '-').tgz" \
              dokuwiki
          fi

          # --- grafana-image-renderer: latest GitHub release ---
          if want grafana-image-renderer; then
            yaml=images/grafana-image-renderer/melange/grafana-image-renderer.yaml
            latest=$(gh api repos/grafana/grafana-image-renderer/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::grafana-image-renderer: no release found upstream"
              FAILED=1
            fi
            bump_row grafana-image-renderer "$yaml" "$latest" \
              "https://github.com/grafana/grafana-image-renderer/archive/refs/tags/v${latest}.tar.gz" \
              grafana-image-renderer
          fi

          # --- cilium: latest GitHub release (agent + operator share one tarball) ---
          if want cilium; then
            latest=$(gh api repos/cilium/cilium/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::cilium: no release found upstream"
              FAILED=1
            else
              url="https://github.com/cilium/cilium/archive/refs/tags/v${latest}.tar.gz"
              bump_row cilium images/cilium/melange/cilium.yaml "$latest" "$url" cilium
              bump_row cilium-operator-generic images/cilium/melange/cilium-operator-generic.yaml "$latest" "$url" cilium
            fi
          fi

          # --- cilium-envoy: follows the ARG CILIUM_ENVOY_IMAGE= pin inside
          # cilium's own images/cilium/Dockerfile at the latest release tag
          # (no GitHub releases on cilium/proxy). The pin is digest-pinned, so
          # the bot re-extracts the per-arch payload shas the same way the
          # melange build does — quay registry API + tar, no docker needed. ---
          if want cilium-envoy; then
            yaml=images/cilium/melange/cilium-envoy.yaml
            ct=$(gh api repos/cilium/cilium/releases/latest --jq '.tag_name')
            line=$(gh api "repos/cilium/cilium/contents/images/cilium/Dockerfile?ref=${ct}" --jq .content \
              | base64 -d | grep -m1 '^ARG CILIUM_ENVOY_IMAGE=' || true)
            ref=${line#*=}
            etag=${ref#*:}; etag=${etag%@*}            # v<maj>.<min>.<pat>-<ts>-<proxy sha>
            edigest=${ref##*@sha256:}
            ever=${etag#v}; ever=${ever%%-*}
            cur=$(awk '/^  version:/{print $2; exit}' "$yaml")
            curd=$(awk '/^  digest: /{print $2; exit}' "$yaml")
            if { [ "$cur" = "$ever" ] && [ "$curd" = "$edigest" ]; } \
               || { [ "$cur" != "$ever" ] && [ "$(printf '%s\n%s\n' "$cur" "$ever" | sort -V | tail -1)" != "$ever" ]; }; then
              echo "cilium-envoy: already at or ahead of $ever, skip"
            else
              idx=$(mktemp -d)
              tok=$(curl -fsSL "https://quay.io/v2/auth?service=quay.io&scope=repository:cilium/cilium-envoy:pull" | jq -r .token)
              ok=1
              curl -fsSL -H "Authorization: Bearer $tok" \
                -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                -o "$idx/index.json" "https://quay.io/v2/cilium/cilium-envoy/manifests/sha256:${edigest}" || ok=0
              echo "${edigest}  $idx/index.json" | sha256sum -c - >/dev/null || ok=0
              if [ "$ok" = 0 ]; then
                echo "::error::cilium-envoy: pinned digest does not resolve"
                FAILED=1
              fi
              if [ "$ok" = 1 ]; then
              for a in amd64 arm64; do
                case $a in amd64) ma=x86_64-linux-gnu ;; arm64) ma=aarch64-linux-gnu ;; esac
                md=$(jq -r --arg a "$a" '.manifests[] | select(.platform.architecture==$a) | .digest' "$idx/index.json")
                curl -fsSL -H "Authorization: Bearer $tok" \
                  -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
                  -o "$idx/$a.json" "https://quay.io/v2/cilium/cilium-envoy/manifests/$md"
                mkdir -p "$idx/$a"
                for d in $(jq -r '.layers[].digest' "$idx/$a.json"); do
                  curl -fsSL -H "Authorization: Bearer $tok" -o "$idx/l.tar" "https://quay.io/v2/cilium/cilium-envoy/blobs/$d"
                  tar xf "$idx/l.tar" -C "$idx/$a" \
                    usr/bin/cilium-envoy usr/bin/cilium-envoy-starter "usr/lib/$ma/libatomic.so.1.2.0" 2>/dev/null || true
                done
                for f in usr/bin/cilium-envoy usr/bin/cilium-envoy-starter "usr/lib/$ma/libatomic.so.1.2.0"; do
                  [ -f "$idx/$a/$f" ] || { echo "::error::cilium-envoy $a: upstream image lacks $f"; FAILED=1; }
                done
                e=$(sha256sum "$idx/$a/usr/bin/cilium-envoy" | awk '{print $1}')
                s=$(sha256sum "$idx/$a/usr/bin/cilium-envoy-starter" | awk '{print $1}')
                l=$(sha256sum "$idx/$a/usr/lib/$ma/libatomic.so.1.2.0" | awk '{print $1}')
                case $a in
                  amd64) SE_A=$e SS_A=$s SL_A=$l ;;
                  arm64) SE_B=$e SS_B=$s SL_B=$l ;;
                esac
              done
              fi
              rm -rf "$idx"
              if [ "$FAILED" = 1 ]; then
                echo "::error::cilium-envoy: extraction failed, no PR opened"
              else
                sed -i "0,/^  version: /s/^  version: .*/  version: $ever/" "$yaml"
                sed -i "s/^  upstream_tag: .*/  upstream_tag: $etag/" "$yaml"
                sed -i "s/^  digest: .*/  digest: $edigest/" "$yaml"
                sed -i "s/^  sha256_amd64: .*/  sha256_amd64: $SE_A/" "$yaml"
                sed -i "s/^  sha256_starter_amd64: .*/  sha256_starter_amd64: $SS_A/" "$yaml"
                sed -i "s/^  sha256_libatomic_amd64: .*/  sha256_libatomic_amd64: $SL_A/" "$yaml"
                sed -i "s/^  sha256_arm64: .*/  sha256_arm64: $SE_B/" "$yaml"
                sed -i "s/^  sha256_starter_arm64: .*/  sha256_starter_arm64: $SS_B/" "$yaml"
                sed -i "s/^  sha256_libatomic_arm64: .*/  sha256_libatomic_arm64: $SL_B/" "$yaml"
                # round-trip guard: every edit must land exactly
                ok=1
                chk() { [ "$(awk -v k="$1" '$1==k{print $2; exit}' "$yaml")" = "$2" ] || ok=0; }
                chk "version:" "$ever"; chk "upstream_tag:" "$etag"; chk "digest:" "$edigest"
                chk "sha256_amd64:" "$SE_A"; chk "sha256_starter_amd64:" "$SS_A"; chk "sha256_libatomic_amd64:" "$SL_A"
                chk "sha256_arm64:" "$SE_B"; chk "sha256_starter_arm64:" "$SS_B"; chk "sha256_libatomic_arm64:" "$SL_B"
                if [ "$ok" != 1 ]; then
                  echo "::error::cilium-envoy: yaml edit did not land as expected"
                  FAILED=1; git checkout -- "$yaml"
                else
                  branch="bump/cilium-envoy-$ever"
                  git switch -c "$branch"
                  git add "$yaml"
                  git commit -m "chore(cilium-envoy): bump $cur -> $ever (pin ${etag})"
                  git push -f origin "$branch"
                  if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                    echo "cilium-envoy: pushed update to existing PR for $branch"
                  else
                    gh pr create --head "$branch" --base main \
                      --title "chore(cilium-envoy): bump $cur -> $ever (pin ${etag})" \
                      --body "**cilium-envoy** \`$cur\` -> \`$ever\` per cilium ${ct}'s ARG CILIUM_ENVOY_IMAGE= pin (detected by the update-versions bot).

          - melange config: \`$yaml\` (\`version\`, \`vars.upstream_tag\`, \`vars.digest\` + all six per-arch \`vars.sha256_*\` re-extracted from the digest-pinned image; \`epoch: 100\` untouched)
          - upstream reference: \`quay.io/cilium/cilium-envoy:${etag}@sha256:${edigest}\`

          Bot PRs don't get automatic CI checks. To validate before merging, run **cilium.yml → Run workflow** with \`ref=$branch\` and **validate_only** checked. The merge push to main then publishes just the cilium-envoy image." || FAILED=1
                  fi
                  echo "cilium-envoy: opened/updated bump PR $cur -> $ever" >> "$GITHUB_STEP_SUMMARY"
                  git switch -C scratch-"$branch" origin/main >/dev/null 2>&1
                fi
              fi
            fi
          fi

          # --- cert-manager: latest GitHub release; the three configs share
          # one tarball, so all three are bumped in a single PR ---
          if want cert-manager; then
            cm_yamls="images/cert-manager/melange/cert-manager-controller.yaml
              images/cert-manager/melange/cert-manager-cainjector.yaml
              images/cert-manager/melange/cert-manager-webhook.yaml"
            cur=$(awk '/^  version:/{print $2; exit}' images/cert-manager/melange/cert-manager-controller.yaml)
            latest=$(gh api repos/cert-manager/cert-manager/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::cert-manager: no release found upstream"
              FAILED=1
            fi
            if [ "$(printf '%s\n%s\n' "$cur" "$latest" | sort -V | tail -1)" != "$latest" ] || [ "$cur" = "$latest" ]; then
              echo "cert-manager: already at or ahead of $latest, skip"
            else
              url="https://github.com/cert-manager/cert-manager/archive/refs/tags/v${latest}.tar.gz"
              if ! cm_sha=$(curl -fsSL --retry 3 "$url" | sha256sum | awk '{print $1}'); then
                echo "::error::cert-manager: could not download $url"
                FAILED=1
              else
                cm_commit=$(gh api repos/cert-manager/cert-manager/git/ref/tags/"v$latest" --jq '.object.sha')
                for yaml in $cm_yamls; do
                  sed -i "0,/^  version: /s/^  version: .*/  version: $latest/" "$yaml"
                  sed -i "0,/^  sha256: /s/^  sha256: .*/  sha256: $cm_sha/" "$yaml"
                  sed -i "0,/^  git_commit: /s/^  git_commit: .*/  git_commit: $cm_commit/" "$yaml"
                done
                ok=1
                for yaml in $cm_yamls; do
                  [ "$(awk '/^  version:/{print $2; exit}' "$yaml")" = "$latest" ] || ok=0
                  [ "$(awk '/^  sha256:/{print $2; exit}' "$yaml")" = "$cm_sha" ] || ok=0
                  [ "$(awk '/^  git_commit:/{print $2; exit}' "$yaml")" = "$cm_commit" ] || ok=0
                done
                if [ "$ok" != 1 ]; then
                  echo "::error::cert-manager: yaml edit did not land as expected"
                  FAILED=1
                  for yaml in $cm_yamls; do git checkout -- "$yaml"; done
                else
                  branch="bump/cert-manager-$latest"
                  git switch -c "$branch"
                  for yaml in $cm_yamls; do git add "$yaml"; done
                  git commit -m "chore(cert-manager): bump $cur -> $latest"
                  git push -f origin "$branch"
                  if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                    echo "cert-manager: pushed update to existing PR for $branch"
                  else
                    gh pr create --head "$branch" --base main \
                      --title "chore(cert-manager): bump $cur -> $latest" \
                      --body "**cert-manager** \`$cur\` -> \`$latest\` (detected by the update-versions bot).

          - melange configs: controller + cainjector + webhook (\`version\`, \`vars.sha256\`, \`vars.git_commit\` bumped together — one shared tarball; \`epoch: 100\` untouched)
          - upstream tarball hashed into the configs: <$url>
          - \`sha256\`: \`$cm_sha\`
          - \`git_commit\`: \`$cm_commit\` (tag ref, so the startup banner matches upstream)

          Bot PRs don't get automatic CI checks. To validate before merging, run **cert-manager.yml → Run workflow** with \`ref=$branch\` and **validate_only** checked: it builds, assembles and grype-scans all three without publishing or signing anything. The merge push to main then publishes the family." || FAILED=1
                  fi
                  echo "cert-manager: opened/updated bump PR $cur -> $latest" >> "$GITHUB_STEP_SUMMARY"
                  git switch -C scratch-"$branch" origin/main >/dev/null 2>&1
                fi
              fi
            fi
          fi

          # --- metallb: controller + speaker share one tarball and move in
          # lockstep, so both configs are bumped in a single PR. releases/latest
          # is the CHART tag (metallb-chart-x.y.z), so filter the tag listing to
          # image tags ^v<digit>. No git_commit var: upstream releases ship the
          # ldflag defaults "dev", so nothing to track. ---
          if want metallb; then
            mlb_yamls="images/metallb/melange/metallb-controller.yaml
              images/metallb/melange/metallb-speaker.yaml"
            cur=$(awk '/^  version:/{print $2; exit}' images/metallb/melange/metallb-controller.yaml)
            latest=$(gh api --paginate repos/metallb/metallb/tags --jq '.[].name' \
              | grep -E '^v[0-9]' | sort -V | tail -1 | sed 's/^v//')
            if [ -z "$latest" ]; then
              echo "::error::metallb: no release tag found upstream"
              FAILED=1
            fi
            if [ "$(printf '%s\n%s\n' "$cur" "$latest" | sort -V | tail -1)" != "$latest" ] || [ "$cur" = "$latest" ]; then
              echo "metallb: already at or ahead of $latest, skip"
            else
              url="https://github.com/metallb/metallb/archive/refs/tags/v${latest}.tar.gz"
              if ! mlb_sha=$(curl -fsSL --retry 3 "$url" | sha256sum | awk '{print $1}'); then
                echo "::error::metallb: could not download $url"
                FAILED=1
              else
                for yaml in $mlb_yamls; do
                  sed -i "0,/^  version: /s/^  version: .*/  version: $latest/" "$yaml"
                  sed -i "0,/^  sha256: /s/^  sha256: .*/  sha256: $mlb_sha/" "$yaml"
                done
                ok=1
                for yaml in $mlb_yamls; do
                  [ "$(awk '/^  version:/{print $2; exit}' "$yaml")" = "$latest" ] || ok=0
                  [ "$(awk '/^  sha256:/{print $2; exit}' "$yaml")" = "$mlb_sha" ] || ok=0
                done
                if [ "$ok" != 1 ]; then
                  echo "::error::metallb: yaml edit did not land as expected"
                  FAILED=1
                  for yaml in $mlb_yamls; do git checkout -- "$yaml"; done
                else
                  branch="bump/metallb-$latest"
                  git switch -c "$branch"
                  for yaml in $mlb_yamls; do git add "$yaml"; done
                  git commit -m "chore(metallb): bump $cur -> $latest"
                  git push -f origin "$branch"
                  if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                    echo "metallb: pushed update to existing PR for $branch"
                  else
                    gh pr create --head "$branch" --base main \
                      --title "chore(metallb): bump $cur -> $latest" \
                      --body "**metallb controller + speaker** \`$cur\` -> \`$latest\` (detected by the update-versions bot).

          - melange configs: metallb-controller + metallb-speaker (\`version\` + \`vars.sha256\` bumped together — one shared tarball; \`epoch: 100\` untouched)
          - upstream tarball hashed into the configs: <$url>
          - \`sha256\`: \`$mlb_sha\`
          - the \`vars.xnet_version\`/\`vars.otel_version\`/\`vars.grpc_version\` pins stay as-is; they are \`go get\` bumps that become no-ops once upstream ships >= them (drop them in the config then)

          Bot PRs don't get automatic CI checks. To validate before merging, run **metallb.yml → Run workflow** with \`ref=$branch\` and **validate_only** checked: it builds, assembles and grype-scans the family without publishing or signing anything. The merge push to main then publishes the metallb pair." || FAILED=1
                  fi
                  echo "metallb: opened/updated bump PR $cur -> $latest" >> "$GITHUB_STEP_SUMMARY"
                  git switch -C scratch-"$branch" origin/main >/dev/null 2>&1
                fi
              fi
            fi
          fi

          # --- frr-k8s: separate upstream repo + version line (own tarball);
          # releases/latest is a plain vX.Y.Z tag ---
          if want frr-k8s; then
            latest=$(gh api repos/metallb/frr-k8s/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::frr-k8s: no release found upstream"
              FAILED=1
            else
              bump_row frr-k8s images/metallb/melange/metallb-frr-k8s.yaml "$latest" \
                "https://github.com/metallb/frr-k8s/archive/refs/tags/v${latest}.tar.gz" metallb
            fi
          fi

          # --- k8s-sidecar: releases/latest is a plain X.Y.Z tag (no 'v') ---
          if want k8s-sidecar; then
            latest=$(gh api repos/kiwigrid/k8s-sidecar/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::k8s-sidecar: no release found upstream"
              FAILED=1
            else
              bump_row k8s-sidecar images/k8s-sidecar/melange/k8s-sidecar.yaml "$latest" \
                "https://github.com/kiwigrid/k8s-sidecar/archive/refs/tags/${latest}.tar.gz" k8s-sidecar
            fi
          fi

          # --- local-path-provisioner: latest GitHub release ---
          if want local-path-provisioner; then
            yaml=images/local-path-provisioner/melange/local-path-provisioner.yaml
            latest=$(gh api repos/rancher/local-path-provisioner/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::local-path-provisioner: no release found upstream"
              FAILED=1
            fi
            bump_row local-path-provisioner "$yaml" "$latest" \
              "https://github.com/rancher/local-path-provisioner/archive/refs/tags/v${latest}.tar.gz" \
              local-path-provisioner
          fi

          # --- gatus: latest GitHub release ---
          if want gatus; then
            yaml=images/gatus/melange/gatus.yaml
            latest=$(gh api repos/TwiN/gatus/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::gatus: no release found upstream"
              FAILED=1
            fi
            bump_row gatus "$yaml" "$latest" \
              "https://github.com/TwiN/gatus/archive/refs/tags/v${latest}.tar.gz" \
              gatus
          fi


          # --- kubernetes-reflector: releases/latest is a vX.Y.Z GitVersion tag ---
          if want kubernetes-reflector; then
            latest=$(gh api repos/emberstack/kubernetes-reflector/releases/latest --jq '.tag_name | ltrimstr("v")')
            if [ -z "$latest" ]; then
              echo "::error::kubernetes-reflector: no release found upstream"
              FAILED=1
            else
              bump_row kubernetes-reflector images/kubernetes-reflector/melange/kubernetes-reflector.yaml "$latest" \
                "https://github.com/emberstack/kubernetes-reflector/archive/refs/tags/v${latest}.tar.gz" kubernetes-reflector
            fi
          fi

          exit $FAILED
