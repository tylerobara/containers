name: cloudnative-pg

# Publishes the apko-built CloudNativePG image to ghcr.io.
# No Dockerfile: apko pushes the multi-arch OCI index straight to the registry.

on:
  push:
    branches: [main]
    paths:
      - images/cloudnative-pg/**
      - .github/workflows/cloudnative-pg.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Tag must start with the PG major (CNPG operator auto-detection).
  # GITHUB_TOKEN may only create a package named owner/repository (unlinked or
  # nested names get DENIED), so variants live in tags, not sub-packages.
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: 18-minimal

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish with apko (x86_64 + aarch64)
        run: |
          # Mount the docker config so apko (running as root in-container)
          # sees the ghcr credentials login-action stored under $HOME.
          docker run --rm --user root \
            -v "$PWD/images/cloudnative-pg/apko:/apko:ro" \
            -v "$HOME/.docker:/root/.docker:ro" \
            cgr.dev/chainguard/apko publish \
            /apko/postgresql-minimal.yaml "$IMAGE:$TAG" \
            --arch x86_64,aarch64

      - name: Smoke test published image
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$TAG"
          IMAGE="$IMAGE:$TAG" ./images/cloudnative-pg/test.sh
