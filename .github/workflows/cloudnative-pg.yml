name: cloudnative-pg

# Publishes apko-assembled (Wolfi base, no Dockerfile) CloudNativePG images to
# ghcr, scanned with grype, cataloged on GitHub Pages from the gh-pages branch.
# Structure follows the minimal repo (rtvkiz/minimal):
#
#   - detect-changes generates the build matrices from the repo contents + the
#     event's diff, so a version-bump PR/push only rebuilds the image whose
#     melange config moved, and adding a new PGDG major = just drop a new
#     images/cloudnative-pg/melange/postgresql-<N>.yaml file.
#   - pull_request runs the whole pipeline WITHOUT publish/sign/pages (PRs have
#     no trusted secrets and must never push tags): melange build, apko lock
#     guard, local apko build, test.sh, grype — so bump PRs are proven green
#     before merge. The same validate-only path is available on demand via
#     workflow_dispatch (ref + validate_only), which is how you validate a
#     bot-opened PR (GITHUB_TOKEN-authored PRs don't auto-run checks).
#   - schedule/workflow_dispatch always full-rebuild; push/PR cancel stale runs.
#
# PostgreSQL is NOT the stale Wolfi prebuild (15.6/16.14/17.10) — it is compiled
# from current PGDG source by melange, packaged as postgresql-<major> with
# provider-priority + epoch 100 so apko can never pick Wolfi's over ours.
# Upstream releases are turned into bump PRs by update-versions.yml.

on:
  push:
    branches: [main]
    paths:
      - images/cloudnative-pg/**
      - images/cloudnative-pg-operator/**
      - images/openbao/**
      - pages/**
      - .github/workflows/cloudnative-pg.yml
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *' # daily — republishes tags so Wolfi CVE patches land within a day
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (defaults to the branch dispatched from). Use a bump-PR branch to validate it."
        required: false
        default: ""
      validate_only:
        description: "Build + scan without publishing/signing/deploying pages"
        type: boolean
        default: false

concurrency:
  # schedule/dispatch get unique groups (never cancelled mid-publish);
  # push/PR runs cancel their superseded predecessor on the same ref.
  group: cloudnative-pg-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/cnpg-postgres
  MELANGE_VERSION: v0.63.0

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------------
  # DETECT WHAT CHANGED — full rebuild on cron/dispatch/workflow-edits, surgical
  # per-image builds on push/PR (minimal's detect-changes pattern, with the
  # matrix derived from the melange configs on disk instead of a hand-maintained
  # list: PG19 support = add postgresql-19.yaml, no workflow edit).
  # ----------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pg-matrix: ${{ steps.filter.outputs.pg-matrix }}
      build-pg-matrix: ${{ steps.filter.outputs.build-pg-matrix }}
      has-pg: ${{ steps.filter.outputs.has-pg }}
      has-op: ${{ steps.filter.outputs.has-op }}
      has-bao: ${{ steps.filter.outputs.has-bao }}
      has-pages: ${{ steps.filter.outputs.has-pages }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed images and build matrices
        id: filter
        run: |
          set -euo pipefail
          EVENT='${{ github.event_name }}'
          OP_YAML=images/cloudnative-pg-operator/melange/cloudnative-pg.yaml
          BAO_YAML=images/openbao/melange/openbao.yaml
          ALL_MAJORS=$(find images/cloudnative-pg/melange -name 'postgresql-*.yaml' 2>/dev/null \
            | sed -nE 's|.*/postgresql-([0-9]+)\.yaml$|\1|p' || true)
          FULL=false; HAS_OP=false; HAS_BAO=false; HAS_PAGES=false; MAJORS=""

          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            FULL=true
          else
            if [ "$EVENT" = pull_request ]; then
              BASE='${{ github.event.pull_request.base.sha }}'
            else
              BASE='${{ github.event.before }}'
            fi
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              FULL=true
            else
              CHANGED=$(git diff --name-only "$BASE" '${{ github.sha }}')
              echo "Changed files:"; echo "${CHANGED:-}" | sed '/^$/d; s/^/  /'
              [ -z "${CHANGED:-}" ] && FULL=true
              # Any change to the pipeline itself → trust nothing, rebuild all.
              echo "${CHANGED:-}" | grep -qE '^\.github/' && FULL=true
              echo "${CHANGED:-}" | grep -q '^images/cloudnative-pg-operator/' && HAS_OP=true
              echo "${CHANGED:-}" | grep -q '^images/openbao/' && HAS_BAO=true
              echo "${CHANGED:-}" | grep -q '^pages/' && HAS_PAGES=true
              PG_CHANGED=$(echo "${CHANGED:-}" | grep '^images/cloudnative-pg/' || true)
              if [ -n "$PG_CHANGED" ]; then
                if echo "$PG_CHANGED" | grep -qvE '^images/cloudnative-pg/melange/postgresql-[0-9]+\.yaml$'; then
                  # shared piece moved (apko template, test.sh, ...) → all majors
                  MAJORS="$ALL_MAJORS"
                else
                  MAJORS=$(echo "$PG_CHANGED" | sed -nE 's|.*postgresql-([0-9]+)\.yaml$|\1|p' | sort -u)
                fi
              fi
            fi
          fi

          if [ "$FULL" = true ]; then
            MAJORS="$ALL_MAJORS"; HAS_OP=true; HAS_BAO=true; HAS_PAGES=true
          fi
          # Only build images whose configs actually exist on the checked-out ref.
          if [ "$HAS_OP" = true ] && [ ! -f "$OP_YAML" ]; then HAS_OP=false; fi
          if [ "$HAS_BAO" = true ] && [ ! -f "$BAO_YAML" ]; then HAS_BAO=false; fi
          # comm wants sorted line streams; normalize either value (space- or
          # newline-separated) and drop anything that is not a plain number.
          numstream() { tr ' ' '\n' <<< "${1:-}" | grep -E '^[0-9]+$' | sort -u; }
          MAJ_JSON=$(comm -12 <(numstream "$MAJORS") <(numstream "$ALL_MAJORS") \
            | jq -R . | jq -sc . || true)
          MAJ_JSON=${MAJ_JSON:-[]}; [ "$(jq -c . <<<"$MAJ_JSON")" ] || MAJ_JSON='[]'

          PG_MATRIX=$(jq -cn --argjson m "$MAJ_JSON" \
            '{include: [$m[] as $maj | [{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}][] | . + {major: $maj}]}')
          BUILD_PG_MATRIX=$(jq -cn --argjson m "$MAJ_JSON" '{include: [$m[] as $maj | {major: $maj}]}')

          # Values go to $GITHUB_OUTPUT only (invisible in logs); mirror them to
          # stdout — this whole step's matrix outputs decide job scheduling, and
          # a bad fromJSON value fails the run with no job to blame.
          echo "DEBUG ALL_MAJORS=[$ALL_MAJORS] MAJORS=[$MAJORS]"
          echo "DEBUG MAJ_JSON=$MAJ_JSON"
          echo "DEBUG PG_MATRIX=$PG_MATRIX"
          echo "DEBUG BUILD_PG_MATRIX=$BUILD_PG_MATRIX"

          {
            echo "pg-matrix=$(tr -d '\n\r' <<<"$PG_MATRIX")"
            echo "build-pg-matrix=$(tr -d '\n\r' <<<"$BUILD_PG_MATRIX")"
            echo "has-pg=$(jq 'length > 0' <<<"$MAJ_JSON")"
            echo "has-op=$HAS_OP"
            echo "has-bao=$HAS_BAO"
            echo "has-pages=$HAS_PAGES"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan"
            echo "- postgres majors: $(jq -c . <<<"$MAJ_JSON")"
            echo "- operator: $HAS_OP"
            echo "- openbao: $HAS_BAO"
            echo "- pages deploy: $HAS_PAGES"
            echo "- full rebuild: $FULL ($EVENT)"
          } >> "$GITHUB_STEP_SUMMARY"

  # One signing key for the whole run: apko verifies every arch's package
  # index, so all melange jobs must sign with the same key. Ephemeral is fine —
  # the key's only consumer is this run's apko step.
  keygen:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      priv: ${{ steps.k.outputs.priv }}
    steps:
      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Generate key
        id: k
        run: |
          ~/go/bin/melange keygen
          { echo "pub=$(base64 -w0 melange.rsa.pub)"; echo "priv=$(base64 -w0 melange.rsa)"; } >> "$GITHUB_OUTPUT"

  melange:
    needs: [keygen, detect-changes]
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-pg == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # NOTE: the whole matrix: key must carry the fromJSON expression — an
      # expression on matrix.include: alone silently drops the job at
      # scheduling time (burned a full run before the debug echoes proved the
      # outputs were valid). Same shape as the minimal repo's build.yml.
      matrix: ${{ fromJSON(needs.detect-changes.outputs.pg-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        # melange signs with the private key but never re-derives the .pub,
        # so write it here — it ships in the artifact for apko's keyring.
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build postgresql-${{ matrix.major }} (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/cloudnative-pg/melange/postgresql-${{ matrix.major }}.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-pg-${{ matrix.major }}-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  melange-operator:
    needs: [keygen, detect-changes]
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-op == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build cloudnative-pg operator (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/cloudnative-pg-operator/melange/cloudnative-pg.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-operator-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  melange-openbao:
    needs: [keygen, detect-changes]
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-bao == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build openbao (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/openbao/melange/openbao.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-openbao-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  build:
    # Run even if one melange leg failed — its major fails alone instead of
    # blocking the others.
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-pg == 'true' }}
    needs: [keygen, melange, detect-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.build-pg-matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      PG_MAJOR: ${{ matrix.major }}
      # Registry writes happen only from trusted main-lineage runs; PRs and
      # validate-only dispatches build locally instead (same lesson as minimal:
      # every publish/sign/attest step hangs off this).
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-pg-${{ matrix.major }}-*
          path: .
          merge-multiple: true

      - name: Resolve pinned PGDG version + render apko config
        run: |
          mkdir -p build
          # The melange config is the source of truth for the PGDG minor.
          PG_FULL=$(awk '/^  version:/{print $2; exit}' "images/cloudnative-pg/melange/postgresql-$PG_MAJOR.yaml")
          case "$PG_FULL" in
            "$PG_MAJOR".[0-9]*) echo "PG_FULL=$PG_FULL" >> "$GITHUB_ENV" ;;
            *) echo "bad version '$PG_FULL' in melange config"; exit 1 ;;
          esac
          sed "s/@@MAJOR@@/$PG_MAJOR/g" images/cloudnative-pg/apko/postgresql.yaml.tpl > "build/postgresql-$PG_MAJOR.yaml"
          echo "Publishing tags: $PG_MAJOR, $PG_FULL, $PG_MAJOR-wolfi, $PG_FULL-wolfi"

      - name: Resolve package versions (apko lock, local repo wins)
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock "/work/build/postgresql-$PG_MAJOR.yaml" \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output "/work/build/pg-$PG_MAJOR.lock.json"
          RESOLVED=$(jq -r --arg p "postgresql-$PG_MAJOR" \
            '.contents.packages[] | select(.name==$p) | .version' "build/pg-$PG_MAJOR.lock.json" | head -1)
          # provider-priority is only consulted when the VERSION ties, and Wolfi
          # can tie (e.g. our 18.6-rN vs its 18.6-r5 rebuild). The configs'
          # epoch: 100 keeps our pkgver strictly above any Wolfi -rN; require
          # the exact pkgver so a Wolfi same-version slip can never ship.
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' "images/cloudnative-pg/melange/postgresql-$PG_MAJOR.yaml")
          if [ "$RESOLVED" != "${PG_FULL}-r${EPOCH}" ]; then
            echo "apko resolved postgresql-$PG_MAJOR as '$RESOLVED', expected '${PG_FULL}-r${EPOCH}' (the melange package lost resolution to Wolfi)"; exit 1
          fi

      # Nested package names (owner/repo/image) — works with GITHUB_TOKEN since
      # the parent owner/repository package exists; CR_PAT (packages:write)
      # overrides if ever needed.
      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image to ghcr
        if: env.PUBLISH == 'true'
        run: |
          M=$PG_MAJOR V=$PG_FULL
          # ghcr intermittently 500s/transient-DENIES on publish (first push
          # into a brand-new nested package races its own creation — cost us a
          # whole run) — retry before believing the failure.
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD/build:/work/build:ro" \
              -v "$PWD/packages:/work/packages:ro" \
              -v "$PWD/melange.rsa.pub:/work/melange.rsa.pub:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish "/work/build/postgresql-$M.yaml" \
                "$IMAGE:$M" "$IMAGE:$V" "$IMAGE:$M-wolfi" "$IMAGE:$V-wolfi" \
                --arch x86_64,aarch64 \
                --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
                --lockfile "/work/build/pg-$M.lock.json"; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "IMG_REF=$IMAGE:$PG_FULL" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$IMAGE:$PG_FULL" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          # Native arch is enough to prove the assembly + smoke test on PRs;
          # the multi-arch lock guard above already proved both resolve.
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish "/work/build/postgresql-$PG_MAJOR.yaml" \
              "cnpg-pg-$PG_MAJOR:validate" \
              --arch x86_64 \
              --local \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub
          echo "IMG_REF=cnpg-pg-$PG_MAJOR:validate" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:cnpg-pg-$PG_MAJOR:validate" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$IMG_REF"
          IMAGE="$IMG_REF" PG_MAJOR="$PG_MAJOR" ./images/cloudnative-pg/test.sh
          # The whole point of the melange stage: the shipped binary must be
          # the PGDG minor the tags claim, not Wolfi's stale prebuild.
          docker run --rm --entrypoint /usr/bin/postgres "$IMG_REF" --version \
            | grep -q "$PG_FULL" || { echo "image reports a version other than $PG_FULL"; exit 1; }

      - name: Scan image with grype
        run: |
          mkdir -p scans
          # registry: source pulls via the OCI API — no docker daemon needed;
          # validate runs use the docker: source against the locally built
          # image. || true: findings must not fail the job — the SIGNING gate
          # below reads the JSON, and the job summary reports the counts.
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file "/out/cnpg-postgres-$PG_MAJOR.json" || true
          # Signing gate: anything Low or above blocks. Negligible/Unknown are
          # excluded on purpose — Wolfi's secdb parks "no fix recorded" CVEs in
          # Unknown, which would veto signing forever.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' \
            "scans/cnpg-postgres-$PG_MAJOR.json")
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "postgresql-$PG_MAJOR Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"
        id: scan

      # Keyless signing: no secret — the cert binds this workflow's identity
      # and lands in Rekor. Signs the manifest DIGEST (never a tag), so a
      # signature can never be pointed at rotated content. Verify with:
      #   cosign verify \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/tylerobara/containers/\.github/workflows/cloudnative-pg\.yml@refs/heads/main$' \
      #     ghcr.io/tylerobara/containers/cnpg-postgres:<tag>
      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMG_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          # cosign's image runs as nonroot and can't read the mounted docker
          # config; numeric 0:0 + explicit DOCKER_CONFIG (same workaround as
          # the grype step). ro mount: cosign only reads credentials.
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$IMG_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"
        # else branch: publish stays green, unsigned — the summary line above
        # says why; nothing to do.

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMG_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$IMAGE" --argjson major "$PG_MAJOR" --arg version "$PG_FULL" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$PG_MAJOR $PG_FULL $PG_MAJOR-wolfi $PG_FULL-wolfi" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --slurpfile scan "scans/cnpg-postgres-$PG_MAJOR.json" \
            '{image: $image, major: $major, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed,
              scan: $scan[0]}' > "scans/cnpg-postgres-$PG_MAJOR.json.tmp"
          mv "scans/cnpg-postgres-$PG_MAJOR.json.tmp" "scans/cnpg-postgres-$PG_MAJOR.json"

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: pages-data-pg-${{ matrix.major }}
          path: scans/cnpg-postgres-${{ matrix.major }}.json

  build-operator:
    needs: [keygen, melange-operator, detect-changes]
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-op == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      OP_IMAGE: ghcr.io/${{ github.repository }}/cloudnative-pg
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-operator-*
          path: .
          merge-multiple: true

      - name: Resolve pinned version + version guard
        run: |
          VER=$(awk '/^  version:/{print $2; exit}' images/cloudnative-pg-operator/melange/cloudnative-pg.yaml)
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' images/cloudnative-pg-operator/melange/cloudnative-pg.yaml)
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "OP_VER=$VER" >> "$GITHUB_ENV"
          echo "OP_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/images/cloudnative-pg-operator/apko/operator.yaml \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output /work/operator.lock.json
          RESOLVED=$(jq -r '.contents.packages[] | select(.name=="cloudnative-pg") | .version' operator.lock.json | head -1)
          # exact pkgver match or the melange package lost resolution to Wolfi
          if [ "$RESOLVED" != "${VER}-r${EPOCH}" ]; then
            echo "apko resolved cloudnative-pg as '$RESOLVED', expected '${VER}-r${EPOCH}'"; exit 1
          fi

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch operator image to ghcr
        if: env.PUBLISH == 'true'
        run: |
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD:/work:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish /work/images/cloudnative-pg-operator/apko/operator.yaml \
                "$OP_IMAGE:$OP_VER" "$OP_IMAGE:$OP_MINOR" "$OP_IMAGE:latest" \
                --arch x86_64,aarch64 \
                --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
                --lockfile /work/operator.lock.json; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "OP_REF=$OP_IMAGE:$OP_VER" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$OP_IMAGE:$OP_VER" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish /work/images/cloudnative-pg-operator/apko/operator.yaml \
              "cnpg-operator:validate" \
              --arch x86_64 \
              --local \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub
          echo "OP_REF=cnpg-operator:validate" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:cnpg-operator:validate" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$OP_REF"
          IMAGE="$OP_REF" VERSION="$OP_VER" ./images/cloudnative-pg-operator/test.sh

      - name: Scan image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file /out/cloudnative-pg-operator.json || true
          # Same signing gate as the postgres images: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/cloudnative-pg-operator.json)
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "operator Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OP_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$OP_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OP_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$OP_IMAGE" --arg version "$OP_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$OP_VER $OP_MINOR latest" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --slurpfile scan scans/cloudnative-pg-operator.json \
            '{image: $image, major: null, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed,
              scan: $scan[0]}' > scans/cloudnative-pg-operator.json.tmp
          mv scans/cloudnative-pg-operator.json.tmp scans/cloudnative-pg-operator.json

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: pages-data-pg-operator
          path: scans/cloudnative-pg-operator.json

  build-openbao:
    needs: [keygen, melange-openbao, detect-changes]
    if: ${{ !cancelled() && needs.keygen.result == 'success' && needs.detect-changes.outputs.has-bao == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      BAO_IMAGE: ghcr.io/${{ github.repository }}/openbao
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.validate_only != true) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-openbao-*
          path: .
          merge-multiple: true

      - name: Resolve pinned version + version guard
        run: |
          VER=$(awk '/^  version:/{print $2; exit}' images/openbao/melange/openbao.yaml)
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' images/openbao/melange/openbao.yaml)
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "BAO_VER=$VER" >> "$GITHUB_ENV"
          echo "BAO_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/images/openbao/apko/openbao.yaml \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output /work/openbao.lock.json
          RESOLVED=$(jq -r '.contents.packages[] | select(.name=="openbao") | .version' openbao.lock.json | head -1)
          # exact pkgver match or the melange package lost resolution to Wolfi
          if [ "$RESOLVED" != "${VER}-r${EPOCH}" ]; then
            echo "apko resolved openbao as '$RESOLVED', expected '${VER}-r${EPOCH}'"; exit 1
          fi

      - name: Log in to ghcr
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch openbao image to ghcr
        if: env.PUBLISH == 'true'
        run: |
          for i in 1 2 3; do
            if docker run --rm --user root \
              -v "$PWD:/work:ro" \
              -v "$HOME/.docker:/root/.docker:ro" \
              cgr.dev/chainguard/apko publish /work/images/openbao/apko/openbao.yaml \
                "$BAO_IMAGE:$BAO_VER" "$BAO_IMAGE:$BAO_MINOR" "$BAO_IMAGE:latest" \
                --arch x86_64,aarch64 \
                --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
                --lockfile /work/openbao.lock.json; then
              break
            fi
            [ "$i" = 3 ] && { echo "apko publish failed after 3 attempts"; exit 1; }
            echo "publish attempt $i failed; retrying in 15s"; sleep 15
          done
          echo "BAO_REF=$BAO_IMAGE:$BAO_VER" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=registry:$BAO_IMAGE:$BAO_VER" >> "$GITHUB_ENV"

      - name: Build image locally (validate-only, no registry)
        if: env.PUBLISH != 'true'
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            cgr.dev/chainguard/apko publish /work/images/openbao/apko/openbao.yaml \
              "openbao:validate" \
              --arch x86_64 \
              --local \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub
          echo "BAO_REF=openbao:validate" >> "$GITHUB_ENV"
          echo "GRYPE_SRC=docker:openbao:validate" >> "$GITHUB_ENV"

      - name: Smoke test image
        run: |
          [ "$PUBLISH" = true ] && docker pull --platform linux/amd64 "$BAO_REF"
          IMAGE="$BAO_REF" VERSION="$BAO_VER" ./images/openbao/test.sh

      - name: Scan image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/anchore/grype:latest "$GRYPE_SRC" \
              --output json --file /out/openbao.json || true
          # Same signing gate as every other image here: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/openbao.json)
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "openbao Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: env.PUBLISH == 'true' && steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$BAO_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$BAO_REF@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        if: env.PUBLISH == 'true'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$BAO_REF" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$BAO_IMAGE" --arg version "$BAO_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$BAO_VER $BAO_MINOR latest" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --slurpfile scan scans/openbao.json \
            '{image: $image, major: null, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed,
              scan: $scan[0]}' > scans/openbao.json.tmp
          mv scans/openbao.json.tmp scans/openbao.json

      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: pages-data-openbao
          path: scans/openbao.json

  pages:
    # Deploy when this run produced scans and at least one of its builders got
    # far enough. Partial builds are fine: entries for images that did NOT
    # rebuild are preserved from the live index.json (bump PRs land per image),
    # keyed on image+major with fresh entries winning.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.detect-changes.outputs.has-pages == 'true' || needs.detect-changes.outputs.has-pg == 'true' || needs.detect-changes.outputs.has-op == 'true' || needs.detect-changes.outputs.has-bao == 'true') }}
    needs: [detect-changes, build, build-operator, build-openbao]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the generated gh-pages branch
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/download-artifact@v8
        if: needs.detect-changes.outputs.has-pg == 'true' || needs.detect-changes.outputs.has-op == 'true' || needs.detect-changes.outputs.has-bao == 'true'
        with:
          pattern: pages-data-*
          path: data
          merge-multiple: true

      - name: Assemble index
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -gt 0 ]; then jq -s '.' "${files[@]}" > /tmp/new.json
          else echo '[]' > /tmp/new.json; fi
          # Previous deployment (first deploy: none yet; Pages can lag by a
          # build or two — worst case a stale entry heals on the next build).
          curl -fsSL --retry 3 "https://tylerobara.github.io/containers/data/index.json" -o /tmp/old.json 2>/dev/null || echo '[]' > /tmp/old.json
          jq -e . /tmp/old.json >/dev/null 2>&1 || echo '[]' > /tmp/old.json
          jq -s '(.[0] // []) as $old | .[1] as $new
                 | reduce ($old + $new)[] as $e ({}; .[($e.image + "/" + ($e.major|tostring))] = $e)
                 | [.[]] | sort_by(.major // 0) | reverse' \
            /tmp/old.json /tmp/new.json > data/index.json
          # CNPG ClusterImageCatalog, sha-pinned to each multi-arch manifest
          # (same shape as cloudnative-pg's postgresql-minimal-trixie catalogs).
          {
            printf 'apiVersion: postgresql.cnpg.io/v1\nkind: ClusterImageCatalog\nmetadata:\n  name: cnpg-postgres-wolfi\n  labels:\n    images.cnpg.io/family: postgresql\n    images.cnpg.io/type: minimal\n    images.cnpg.io/os: wolfi\n    images.cnpg.io/date: "%s"\n    images.cnpg.io/publisher: tylerobara.github.io\nspec:\n  images:\n' "$(date -u +%Y%m%d)"
            jq -r 'map(select(.major)) | sort_by(.major)[] | "  - major: \(.major)\n    image: \(.image):\(.version)@\(.digest)"' data/index.json
          } > data/cluster-image-catalog.yaml

      - name: Deploy to gh-pages
        run: |
          dst=$(mktemp -d)
          git -C "$dst" init -q
          cp pages/index.html "$dst/index.html"
          cp -r data "$dst/data"
          git -C "$dst" add -A
          git -C "$dst" -c user.name=github-actions[bot] \
                           -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "Deploy $(date -u +%FT%TZ)"
          git -C "$dst" push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages
