name: cloudnative-pg

# Publishes apko-assembled (Wolfi base, no Dockerfile) CloudNativePG PostgreSQL
# images to ghcr for every PGDG-supported major, scanned with grype, cataloged
# on GitHub Pages from the gh-pages branch. The CloudNativePG operator image
# (Go manager binary built from upstream source by melange) is in
# images/cloudnative-pg-operator/.
#
# PostgreSQL itself is NOT the stale Wolfi prebuild (15.6/16.14/17.10) — it is
# compiled from current PGDG source by melange (see images/cloudnative-pg/melange/),
# packaged as postgresql-<major> with provider-priority so apko picks it.
# PGDG minor releases are picked up by bumping version+sha256 in those configs.

on:
  push:
    branches: [main]
    paths:
      - images/cloudnative-pg/**
      - images/cloudnative-pg-operator/**
      - pages/**
      - .github/workflows/cloudnative-pg.yml
  schedule:
    - cron: '0 6 * * *' # daily — republishes tags so Wolfi CVE patches land within a day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}/cnpg-postgres
  MELANGE_VERSION: v0.63.0

permissions:
  contents: read
  packages: write

jobs:
  # One signing key for the whole run: apko verifies every arch's package
  # index, so all melange jobs must sign with the same key. Ephemeral is fine —
  # the key's only consumer is this run's apko step.
  keygen:
    runs-on: ubuntu-latest
    outputs:
      pub: ${{ steps.k.outputs.pub }}
      priv: ${{ steps.k.outputs.priv }}
    steps:
      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Generate key
        id: k
        run: |
          ~/go/bin/melange keygen
          { echo "pub=$(base64 -w0 melange.rsa.pub)"; echo "priv=$(base64 -w0 melange.rsa)"; } >> "$GITHUB_OUTPUT"

  melange:
    needs: keygen
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        major: [15, 16, 17, 18]
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        # melange signs with the private key but never re-derives the .pub,
        # so write it here — it ships in the artifact for apko's keyring.
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build postgresql-${{ matrix.major }} (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/cloudnative-pg/melange/postgresql-${{ matrix.major }}.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v7
        with:
          name: packages-pg-${{ matrix.major }}-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  melange-operator:
    needs: keygen
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install melange
        run: go install chainguard.dev/melange@${{ env.MELANGE_VERSION }}

      - name: Restore signing key
        run: |
          echo '${{ needs.keygen.outputs.priv }}' | base64 -d > melange.rsa && chmod 600 melange.rsa
          echo '${{ needs.keygen.outputs.pub }}' | base64 -d > melange.rsa.pub

      - name: Build cloudnative-pg operator (${{ matrix.arch }})
        run: |
          ~/go/bin/melange build images/cloudnative-pg-operator/melange/cloudnative-pg.yaml \
            --arch ${{ matrix.arch }} \
            --signing-key melange.rsa \
            --out-dir ./packages \
            --runner docker

      - uses: actions/upload-artifact@v4
        with:
          name: packages-operator-${{ matrix.arch }}
          path: |
            packages/
            melange.rsa.pub

  build:
    # Run even if one melange leg failed — its major fails alone at publish
    # time instead of blocking the other three.
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    needs: [keygen, melange]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        major: [15, 16, 17, 18]
    permissions:
      contents: read
      packages: write
      id-token: write # only for cosign keyless below
    env:
      PG_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-pg-${{ matrix.major }}-*
          path: .
          merge-multiple: true

      - name: Resolve pinned PGDG version + render apko config
        run: |
          mkdir -p build
          # The melange config is the source of truth for the PGDG minor.
          PG_FULL=$(awk '/^  version:/{print $2; exit}' "images/cloudnative-pg/melange/postgresql-$PG_MAJOR.yaml")
          case "$PG_FULL" in
            "$PG_MAJOR".[0-9]*) echo "PG_FULL=$PG_FULL" >> "$GITHUB_ENV" ;;
            *) echo "bad version '$PG_FULL' in melange config"; exit 1 ;;
          esac
          sed "s/@@MAJOR@@/$PG_MAJOR/g" images/cloudnative-pg/apko/postgresql.yaml.tpl > "build/postgresql-$PG_MAJOR.yaml"
          echo "Publishing tags: $PG_MAJOR, $PG_FULL, $PG_MAJOR-wolfi, $PG_FULL-wolfi"

      - name: Resolve package versions (apko lock, local repo wins)
        run: |
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock "/work/build/postgresql-$PG_MAJOR.yaml" \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output "/work/build/pg-$PG_MAJOR.lock.json"
          RESOLVED=$(jq -r --arg p "postgresql-$PG_MAJOR" \
            '.contents.packages[] | select(.name==$p) | .version' "build/pg-$PG_MAJOR.lock.json" | head -1)
          # provider-priority is only consulted when the VERSION ties, and Wolfi
          # can tie (e.g. our 18.6-rN vs its 18.6-r5 rebuild). The configs'
          # epoch: 100 keeps our pkgver strictly above any Wolfi -rN; require
          # the exact pkgver so a Wolfi same-version slip can never ship.
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' "images/cloudnative-pg/melange/postgresql-$PG_MAJOR.yaml")
          if [ "$RESOLVED" != "${PG_FULL}-r${EPOCH}" ]; then
            echo "apko resolved postgresql-$PG_MAJOR as '$RESOLVED', expected '${PG_FULL}-r${EPOCH}' (the melange package lost resolution to Wolfi)"; exit 1
          fi

      # Nested package names (owner/repo/image) — works with GITHUB_TOKEN since
      # the parent owner/repository package exists; CR_PAT (packages:write)
      # overrides if ever needed.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch image to ghcr
        run: |
          M=$PG_MAJOR V=$PG_FULL
          docker run --rm --user root \
            -v "$PWD/build:/work/build:ro" \
            -v "$PWD/packages:/work/packages:ro" \
            -v "$PWD/melange.rsa.pub:/work/melange.rsa.pub:ro" \
            -v "$HOME/.docker:/root/.docker:ro" \
            cgr.dev/chainguard/apko publish "/work/build/postgresql-$M.yaml" \
              "$IMAGE:$M" "$IMAGE:$V" "$IMAGE:$M-wolfi" "$IMAGE:$V-wolfi" \
              --arch x86_64,aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --lockfile "/work/build/pg-$M.lock.json"

      - name: Smoke test published image
        run: |
          docker pull --platform linux/amd64 "$IMAGE:$PG_FULL"
          IMAGE="$IMAGE:$PG_FULL" PG_MAJOR="$PG_MAJOR" ./images/cloudnative-pg/test.sh
          # The whole point of the melange stage: the shipped binary must be
          # the PGDG minor the tags claim, not Wolfi's stale prebuild.
          docker run --rm --entrypoint /usr/bin/postgres "$IMAGE:$PG_FULL" --version \
            | grep -q "$PG_FULL" || { echo "image reports a version other than $PG_FULL"; exit 1; }

      - name: Scan published image with grype
        id: scan
        run: |
          mkdir -p scans
          # registry: source pulls via the OCI API — no docker daemon needed;
          # docker config is mounted for ghcr auth should the package be private.
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            ghcr.io/anchore/grype:latest "registry:$IMAGE:$PG_FULL" \
              --output json --file "/out/cnpg-postgres-$PG_MAJOR.json"
          # Signing gate: anything Low or above blocks. Negligible/Unknown are
          # excluded on purpose — Wolfi's secdb parks "no fix recorded" CVEs in
          # Unknown, which would veto signing forever.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' \
            "scans/cnpg-postgres-$PG_MAJOR.json")
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      # Keyless signing: no secret — the cert binds this workflow's identity
      # and lands in Rekor. Signs the manifest DIGEST (never a tag), so a
      # signature can never be pointed at rotated content. Verify with:
      #   cosign verify \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      #     --certificate-identity-regexp '^https://github.com/tylerobara/containers/\.github/workflows/cloudnative-pg\.yml@refs/heads/main$' \
      #     ghcr.io/tylerobara/containers/cnpg-postgres:<tag>
      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$PG_FULL" \
            --format '{{json .Manifest}}' | jq -r .digest)
          # cosign's image runs as nonroot and can't read the mounted docker
          # config; numeric 0:0 + explicit DOCKER_CONFIG (same workaround as
          # the grype step). ro mount: cosign only reads credentials.
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$IMAGE@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"
        # else branch: publish stays green, unsigned — the summary line above
        # says why; nothing to do.

      - name: Build pages data
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$PG_FULL" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$IMAGE" --argjson major "$PG_MAJOR" --arg version "$PG_FULL" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$PG_MAJOR $PG_FULL $PG_MAJOR-wolfi $PG_FULL-wolfi" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --slurpfile scan "scans/cnpg-postgres-$PG_MAJOR.json" \
            '{image: $image, major: $major, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed,
              scan: $scan[0]}' > "scans/cnpg-postgres-$PG_MAJOR.json.tmp"
          mv "scans/cnpg-postgres-$PG_MAJOR.json.tmp" "scans/cnpg-postgres-$PG_MAJOR.json"

      - uses: actions/upload-artifact@v7
        with:
          name: pages-data-pg-${{ matrix.major }}
          path: scans/cnpg-postgres-${{ matrix.major }}.json

  build-operator:
    needs: [keygen, melange-operator]
    if: ${{ !cancelled() && needs.keygen.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OP_IMAGE: ghcr.io/${{ github.repository }}/cloudnative-pg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-operator-*
          path: .
          merge-multiple: true

      - name: Resolve pinned version + version guard
        run: |
          VER=$(awk '/^  version:/{print $2; exit}' images/cloudnative-pg-operator/melange/cloudnative-pg.yaml)
          EPOCH=$(awk '/^  epoch:/{print $2; exit}' images/cloudnative-pg-operator/melange/cloudnative-pg.yaml)
          case "$VER" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad version '$VER'"; exit 1 ;; esac
          echo "OP_VER=$VER" >> "$GITHUB_ENV"
          echo "OP_MINOR=$(echo "$VER" | cut -d. -f1,2)" >> "$GITHUB_ENV"
          docker run --rm --user root \
            -v "$PWD:/work" \
            cgr.dev/chainguard/apko lock /work/images/cloudnative-pg-operator/apko/operator.yaml \
              --arch x86_64 --arch aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --output /work/operator.lock.json
          RESOLVED=$(jq -r '.contents.packages[] | select(.name=="cloudnative-pg") | .version' operator.lock.json | head -1)
          # exact pkgver match or the melange package lost resolution to Wolfi
          if [ "$RESOLVED" != "${VER}-r${EPOCH}" ]; then
            echo "apko resolved cloudnative-pg as '$RESOLVED', expected '${VER}-r${EPOCH}'"; exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch operator image to ghcr
        run: |
          docker run --rm --user root \
            -v "$PWD:/work:ro" \
            -v "$HOME/.docker:/root/.docker:ro" \
            cgr.dev/chainguard/apko publish /work/images/cloudnative-pg-operator/apko/operator.yaml \
              "$OP_IMAGE:$OP_VER" "$OP_IMAGE:$OP_MINOR" "$OP_IMAGE:latest" \
              --arch x86_64,aarch64 \
              --repository-append /work/packages --keyring-append /work/melange.rsa.pub \
              --lockfile /work/operator.lock.json

      - name: Smoke test published image
        run: |
          docker pull --platform linux/amd64 "$OP_IMAGE:$OP_VER"
          IMAGE="$OP_IMAGE:$OP_VER" VERSION="$OP_VER" ./images/cloudnative-pg-operator/test.sh

      - name: Scan published image with grype
        id: scan
        run: |
          mkdir -p scans
          docker run --rm --user 0:0 \
            -v "$PWD/scans:/out" \
            -v "$HOME/.docker:/root/.docker:ro" \
            ghcr.io/anchore/grype:latest "registry:$OP_IMAGE:$OP_VER" \
              --output json --file /out/cloudnative-pg-operator.json
          # Same signing gate as the postgres images: any Low+ finding blocks.
          LOWPLUS=$(jq '[.matches[] | select(.vulnerability.severity
                     | IN("Low","Medium","High","Critical"))] | length' scans/cloudnative-pg-operator.json)
          echo "lowplus=$LOWPLUS" >> "$GITHUB_OUTPUT"
          echo "operator Low+ findings: $LOWPLUS" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign with cosign (only when scan has 0 Low+ findings)
        if: steps.scan.outputs.lowplus == '0'
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OP_IMAGE:$OP_VER" \
            --format '{{json .Manifest}}' | jq -r .digest)
          docker run --rm --user 0:0 \
            -v "$HOME/.docker:/root/.docker:ro" \
            -e DOCKER_CONFIG=/root/.docker \
            -e GITHUB_ACTIONS \
            -e ACTIONS_ID_TOKEN_REQUEST_URL -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            ghcr.io/sigstore/cosign/cosign:latest sign --yes "$OP_IMAGE@$DIGEST"
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Build pages data
        run: |
          DIGEST=$(docker buildx imagetools inspect "$OP_IMAGE:$OP_VER" \
            --format '{{json .Manifest}}' | jq -r .digest)
          jq -n \
            --arg image "$OP_IMAGE" --arg version "$OP_VER" \
            --arg digest "$DIGEST" --arg built "$(date -u +%FT%TZ)" \
            --arg tags "$OP_VER $OP_MINOR latest" \
            --arg built_with melange --argjson signed "${SIGNED:-false}" \
            --slurpfile scan scans/cloudnative-pg-operator.json \
            '{image: $image, major: null, version: $version,
              tags: ($tags | split(" ")), digest: $digest, built: $built, built_with: $built_with,
              signed: $signed,
              scan: $scan[0]}' > scans/cloudnative-pg-operator.json.tmp
          mv scans/cloudnative-pg-operator.json.tmp scans/cloudnative-pg-operator.json

      - uses: actions/upload-artifact@v4
        with:
          name: pages-data-pg-operator
          path: scans/cloudnative-pg-operator.json

  pages:
    if: ${{ !cancelled() }} # deploy whatever scans exist, even if some matrix legs failed
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the generated gh-pages branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: pages-data-pg-*
          path: data
          merge-multiple: true

      - name: Assemble index
        run: |
          shopt -s nullglob
          files=(data/*.json)
          if [ ${#files[@]} -gt 0 ]; then
            jq -s 'sort_by(.major // 0) | reverse' "${files[@]}" > data/index.json
            # CNPG ClusterImageCatalog, sha-pinned to each multi-arch manifest
            # (same shape as cloudnative-pg's postgresql-minimal-trixie catalogs).
            {
              printf 'apiVersion: postgresql.cnpg.io/v1\nkind: ClusterImageCatalog\nmetadata:\n  name: cnpg-postgres-wolfi\n  labels:\n    images.cnpg.io/family: postgresql\n    images.cnpg.io/type: minimal\n    images.cnpg.io/os: wolfi\n    images.cnpg.io/date: "%s"\n    images.cnpg.io/publisher: tylerobara.github.io\nspec:\n  images:\n' "$(date -u +%Y%m%d)"
              jq -r 'map(select(.major)) | sort_by(.major)[] | "  - major: \(.major)\n    image: \(.image):\(.version)@\(.digest)"' data/index.json
            } > data/cluster-image-catalog.yaml
          else echo '[]' > data/index.json; fi

      - name: Deploy to gh-pages
        run: |
          dst=$(mktemp -d)
          git -C "$dst" init -q
          cp pages/index.html "$dst/index.html"
          cp -r data "$dst/data"
          git -C "$dst" add -A
          git -C "$dst" -c user.name=github-actions[bot] \
                           -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "Deploy $(date -u +%FT%TZ)"
          git -C "$dst" push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git" HEAD:gh-pages
